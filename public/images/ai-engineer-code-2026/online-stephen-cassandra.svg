<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="PR의 문장 하나를 실행 증거에 연결하기"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">PR의 문장 하나를 실행 증거에 연결하기</text><text x="48" y="101" font-size="18">Stephen·Cassandra Chin 발표를 바탕으로 한 필자의 개념도</text><rect x="300" y="145" width="400" height="95" rx="14" fill="#d9eae5"/><text x="320" y="183" font-size="23" font-weight="700">주장: 검사를 통과했다</text><text x="320" y="219" font-size="19">현재 변경에 대한 설명</text><path d="M500 245V290" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="305" width="400" height="95" rx="14" fill="#d9eae5"/><text x="320" y="343" font-size="23" font-weight="700">검사 실행 기록</text><text x="320" y="379" font-size="19">명령·결과·시각</text><path d="M295 350H245" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M705 350H755" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="305" width="185" height="95" rx="14" fill="#e1e8e0"/><text x="68" y="343" font-size="23" font-weight="700">실행 위치</text><rect x="768" y="305" width="185" height="95" rx="14" fill="#e1e8e0"/><text x="788" y="343" font-size="23" font-weight="700">코드 버전</text><path d="M500 405V455" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="300" y="470" width="400" height="95" rx="14" fill="#eadfcf"/><text x="320" y="508" font-size="23" font-weight="700">현재 PR과 대조</text><text x="320" y="544" font-size="19">이 결과가 지금도 유효한가</text><text x="48" y="620" font-size="20">과거의 성공 기록이 현재 변경의 검증을 대신하지 않게 한다.</text></g></svg>