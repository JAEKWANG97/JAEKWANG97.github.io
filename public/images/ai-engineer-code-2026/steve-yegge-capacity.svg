<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#617782}.head{font-size:25px;font-weight:700}.body{font-size:21px}</style><text x="50" y="66" class="title">더 많이 만드는 능력과, 변화를 받아들이는 능력</text><text x="50" y="108" class="sub">Wyvern 사례의 문제를 재구성한 설명용 도식 · 정량 비교 아님</text><rect x="50" y="160" width="350" height="330" rx="16" fill="white" stroke="#147d83" stroke-width="2"/><rect x="50" y="160" width="350" height="8" fill="#147d83"/><text x="74" y="214" class="head">생성 능력</text><text x="74" y="270" class="body">코드와 기능을 만든다</text><text x="74" y="312" class="body">추론 예산을 사용한다</text><text x="74" y="354" class="body">작업을 병렬로 수행한다</text><text x="74" y="396" class="body">생산량만 늘릴 수 있다</text><rect x="425" y="160" width="350" height="330" rx="16" fill="white" stroke="#c57831" stroke-width="2"/><rect x="425" y="160" width="350" height="8" fill="#c57831"/><text x="449" y="214" class="head">운영·검증 능력</text><text x="449" y="270" class="body">막힌 작업을 발견한다</text><text x="449" y="312" class="body">현재 규칙을 정리한다</text><text x="449" y="354" class="body">사람이 판단할 일을 남긴다</text><text x="449" y="396" class="body">확인할 수 있는 변화량</text><rect x="800" y="160" width="350" height="330" rx="16" fill="white" stroke="#486aa6" stroke-width="2"/><rect x="800" y="160" width="350" height="8" fill="#486aa6"/><text x="824" y="214" class="head">이용자의 수용 능력</text><text x="824" y="270" class="body">변경을 읽고 이해한다</text><text x="824" y="312" class="body">새 사용법을 익힌다</text><text x="824" y="354" class="body">실제로 써 보고 반응한다</text><text x="824" y="396" class="body">가치로 이어지는 변화량</text><line x1="50" y1="532" x2="1150" y2="532" stroke="#ccd6d7"/><text x="50" y="575" class="sub">앞단이 빨라져도 뒤의 판단과 학습 시간이 자동으로 줄어드는 것은 아니다.</text></svg>