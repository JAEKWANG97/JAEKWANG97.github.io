<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>업무 유입과 실행과 결과 관찰의 순환</title><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#617782}.head{font-size:25px;font-weight:700}.body{font-size:21px}</style><text x="50" y="66" class="title">고정 계획의 실행에서, 지속되는 업무 조정으로</text><text x="50" y="108" class="sub">Workstream의 역할을 재구성한 설명용 도식</text><rect x="50" y="160" width="350" height="330" rx="16" fill="white" stroke="#147d83" stroke-width="2"/><rect x="50" y="160" width="350" height="8" fill="#147d83"/><text x="74" y="214" class="head">업무 유입과 판단</text><text x="74" y="270" class="body">새 신호를 받는다</text><text x="74" y="312" class="body">중복과 목표 적합성 확인</text><text x="74" y="354" class="body">명세와 범위 검토</text><text x="74" y="396" class="body">계속 방향을 바꿀 수 있다</text><rect x="425" y="160" width="350" height="330" rx="16" fill="white" stroke="#c57831" stroke-width="2"/><rect x="425" y="160" width="350" height="8" fill="#c57831"/><text x="449" y="214" class="head">담당과 실행</text><text x="449" y="270" class="body">영역별 담당을 정한다</text><text x="449" y="312" class="body">실행 환경을 분리한다</text><text x="449" y="354" class="body">공유 문서에 결과를 남긴다</text><text x="449" y="396" class="body">PR과 검증 근거를 만든다</text><rect x="800" y="160" width="350" height="330" rx="16" fill="white" stroke="#486aa6" stroke-width="2"/><rect x="800" y="160" width="350" height="8" fill="#486aa6"/><text x="824" y="214" class="head">관찰과 권한 조정</text><text x="824" y="270" class="body">병합 이후 결과를 본다</text><text x="824" y="312" class="body">재수정·되돌림을 확인한다</text><text x="824" y="354" class="body">다음 업무에 학습을 반영</text><text x="824" y="396" class="body">자율성은 정책 범위 안에서</text><line x1="50" y1="532" x2="1150" y2="532" stroke="#ccd6d7"/><text x="50" y="575" class="sub">실행 시간이나 에이전트 수가 아니라, 업무의 흐름과 검토 지점을 설계한다.</text><path d="M403 325H422M415 318L422 325L415 332M778 325H797M790 318L797 325L790 332" fill="none" stroke="#617782" stroke-width="2"/></svg>