<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Brian: 로그가 있어도 심사는 틀릴 수 있다</title><desc id="desc">기존 방식도 두 자료를 모두 봤다. 입력 추가만의 문제가 아니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Brian: 로그가 있어도 심사는 틀릴 수 있다</text><text x="35" y="84" font-size="17">기존 방식도 두 자료를 모두 봤다. 입력 추가만의 문제가 아니다.</text><rect x="40" y="125" width="350" height="120" rx="13" fill="#dfece5"/><text x="58" y="159" font-size="21" font-weight="700">에이전트의 보고</text><text x="58" y="189" font-size="18" font-weight="400">이메일 예약 완료라는 주장</text><rect x="430" y="125" width="350" height="120" rx="13" fill="#ede2cb"/><text x="448" y="159" font-size="21" font-weight="700">실행 도구의 기록</text><text x="448" y="189" font-size="18" font-weight="400">기록 생성 실패 · 할 일 생성</text><path d="M205,245 L330,300" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M615,245 L490,300" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="170" y="310" width="480" height="100" rx="13" fill="#dfece5"/><text x="188" y="344" font-size="21" font-weight="700">기존 심사: 성공 보고를 승인</text><text x="188" y="374" font-size="18" font-weight="400">실패 기록보다 이야기를 믿은 사례</text><text x="40" y="460" font-size="18">새 접근: 지시·입력·도구 결과·보고를 좁은 질문으로 대조</text><rect x="170" y="490" width="480" height="110" rx="13" fill="#dfece5"/><text x="188" y="524" font-size="21" font-weight="700">Jev의 선택과 일곱 예·아니요 질문</text><text x="188" y="554" font-size="18" font-weight="400">승인 / 재시도 / 중단 및 보완 피드백</text><path d="M310,600 L205,655" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M510,600 L615,655" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="665" width="350" height="100" rx="13" fill="#dfece5"/><text x="58" y="699" font-size="21" font-weight="700">판정 기준 충족</text><text x="58" y="729" font-size="18" font-weight="400">승인 또는 재시도·중단</text><rect x="430" y="665" width="350" height="100" rx="13" fill="#ede2cb"/><text x="448" y="699" font-size="21" font-weight="700">불확실한 구간</text><text x="448" y="729" font-size="18" font-weight="400">기존 LLM 심사기로 전달</text><text x="40" y="817" font-size="18">그림자 실행에서는 새 판단을 기록하되 실제 결정은 바꾸지 않음</text><text x="40" y="855" font-size="18">자체 설명도. 임계값은 해당 팀의 평가 집합에서 조정됐다.</text></g></svg>