<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Jeffrey: 검색 실패는 한 가지가 아니다</title><desc id="desc">최종 점수보다 먼저 어떤 단계가 실패했는지 구분한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Jeffrey: 검색 실패는 한 가지가 아니다</text><text x="35" y="84" font-size="17">최종 점수보다 먼저 어떤 단계가 실패했는지 구분한다.</text><rect x="40" y="135" width="740" height="120" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">조건을 놓친 결과</text><text x="58" y="199" font-size="18" font-weight="400">미국 밖 기업 요청 → 미국 기업 포함</text><text x="58" y="229" font-size="18" font-weight="400">필요한 확인: 후보가 요청 조건을 모두 만족하는가?</text><path d="M410,255 L410,300" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="310" width="740" height="120" rx="13" fill="#dfece5"/><text x="58" y="344" font-size="21" font-weight="700">처음부터 없는 자료</text><text x="58" y="374" font-size="18" font-weight="400">유료 · 전문 자료가 검색 범위 밖에 있음</text><text x="58" y="404" font-size="18" font-weight="400">필요한 확인: 정당한 접근 권한과 제공 범위</text><path d="M410,430 L410,475" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="485" width="740" height="120" rx="13" fill="#dfece5"/><text x="58" y="519" font-size="21" font-weight="700">찾았지만 읽기 비효율적</text><text x="58" y="549" font-size="18" font-weight="400">긴 페이지 → 노벨상 수상자를 답하는 관련 발췌</text><text x="58" y="579" font-size="18" font-weight="400">필요한 확인: 질문에 답하는 문맥과 출처 연결</text><rect x="40" y="655" width="740" height="120" rx="13" fill="#ede2cb"/><text x="58" y="689" font-size="21" font-weight="700">ATLAS 화면 설명의 서로 다른 수치</text><text x="58" y="719" font-size="18" font-weight="400">절대점수: 검색 없음 9% / 키워드 28% / 의미 검색 45%</text><text x="58" y="749" font-size="18" font-weight="400">+56%는 키워드 대비 개선율. 절대점수 56%가 아니다.</text><text x="40" y="827" font-size="18">세 층은 점검 순서의 재구성이다. 제품의 내부 단계도가 아니다.</text><text x="40" y="862" font-size="18">공식 읽기판의 화면 설명에 근거. 독립 성능 재현은 하지 않음.</text></g></svg>