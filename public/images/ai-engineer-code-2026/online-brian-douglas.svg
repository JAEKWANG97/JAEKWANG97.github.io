<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="t d"><title id="t">불만이 아니라 판단의 이유를 남긴다</title><desc id="d">컴파일 성공과 팀의 설계에 맞는 변경은 다르다. 관찰: 에이전트 제안과 사람이 수정한 순간을 함께 기록. 맥락: 거절 이유 · 기존 대안 · 적용 범위를 구분. 재사용: 스킬이나 리뷰 보조에 연결, 사람 승인과 구별. 검증: 새 변경에서도 중요한 오류를 찾는지 확인</desc><rect width="760" height="750" rx="24" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#203638"><text x="40" y="55" font-size="28" font-weight="700">불만이 아니라 판단의 이유를 남긴다</text><text x="40" y="91" font-size="18">컴파일 성공과 팀의 설계에 맞는 변경은 다르다.</text><rect x="35" y="125" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="165" font-size="24" font-weight="700">관찰</text><text x="58" y="204" font-size="19">에이전트 제안과 사람이 수정한 순간을 함께 기록</text><rect x="35" y="260" width="690" height="110" rx="16" fill="#e5e8f1"/><text x="58" y="300" font-size="24" font-weight="700">맥락</text><text x="58" y="339" font-size="19">거절 이유 · 기존 대안 · 적용 범위를 구분</text><rect x="35" y="395" width="690" height="110" rx="16" fill="#eee4df"/><text x="58" y="435" font-size="24" font-weight="700">재사용</text><text x="58" y="474" font-size="19">스킬이나 리뷰 보조에 연결, 사람 승인과 구별</text><rect x="35" y="530" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="570" font-size="24" font-weight="700">검증</text><text x="58" y="609" font-size="19">새 변경에서도 중요한 오류를 찾는지 확인</text><text x="40" y="709" font-size="18">공개 수집 도구 ≠ 비공개 리뷰 모델 · 성능은 별도 평가</text><text x="40" y="737" font-size="16">발표에서 착안한 독자적 설명 도식. 원본 슬라이드가 아니다.</text></g></svg>