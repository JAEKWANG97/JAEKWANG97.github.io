<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Chinmay: 제안을 만들기와 고르기</title><desc id="desc">응답 뒤의 제한 시간 안에 고르지 못하면 기능이 사라진다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Chinmay: 제안을 만들기와 고르기</text><text x="35" y="84" font-size="17">응답 뒤의 제한 시간 안에 고르지 못하면 기능이 사라진다.</text><rect x="40" y="130" width="350" height="120" rx="13" fill="#dfece5"/><text x="58" y="164" font-size="21" font-weight="700">여러 제안 생성기</text><text x="58" y="194" font-size="18" font-weight="400">후속 질문 후보를 생성</text><rect x="430" y="130" width="350" height="120" rx="13" fill="#dfece5"/><text x="448" y="164" font-size="21" font-weight="700">대화 문맥</text><text x="448" y="194" font-size="18" font-weight="400">원래 질문과 Glean의 답변</text><path d="M215,250 L330,305" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M605,250 L490,305" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="140" y="315" width="540" height="120" rx="13" fill="#dfece5"/><text x="158" y="349" font-size="21" font-weight="700">순위 단계: 후보 중 선택</text><text x="158" y="379" font-size="18" font-weight="400">중앙 지연 4.67초 → 0.67초</text><text x="158" y="409" font-size="18" font-weight="400">이 값은 엔진 전체의 지연이 아니다.</text><path d="M410,435 L410,495" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="505" width="620" height="110" rx="13" fill="#dfece5"/><text x="118" y="539" font-size="21" font-weight="700">제안 엔진: 제한 시간 내 처리</text><text x="118" y="569" font-size="18" font-weight="400">타임아웃 10.2% → 0.8%</text><path d="M410,615 L410,675" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="685" width="620" height="105" rx="13" fill="#dfece5"/><text x="118" y="719" font-size="21" font-weight="700">사용자에게 제안 노출</text><text x="118" y="749" font-size="18" font-weight="400">전체 턴 중 83% → 91%</text><text x="40" y="833" font-size="18">수치는 공식 읽기판의 발표 화면 설명. 다른 구성의 보장 아님.</text><text x="40" y="867" font-size="18">자체 흐름도. 오프라인 평가 → 사내 사용 → 고객 A/B 확인.</text></g></svg>