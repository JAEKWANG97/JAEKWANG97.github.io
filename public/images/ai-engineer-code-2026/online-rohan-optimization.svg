<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="t d"><title id="t">좋은 설정은 실험 조건과 한 쌍이다</title><desc id="d">개선율만 옮기지 말고, 무엇을 측정했는지도 남긴다. 조건 정의: 모델 · 하드웨어 · 입력/출력 길이 · 목표 지연. 후보 탐색: 설정 제안 → 실행 → 측정 → 다음 후보 선택. 결과 보존: 선택된 YAML과 시도별 비교 보고서. 적용 전 확인: 새 사용 조건에서도 개선이 유지되는지 재측정</desc><rect width="760" height="750" rx="24" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#203638"><text x="40" y="55" font-size="28" font-weight="700">좋은 설정은 실험 조건과 한 쌍이다</text><text x="40" y="91" font-size="18">개선율만 옮기지 말고, 무엇을 측정했는지도 남긴다.</text><rect x="35" y="125" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="165" font-size="24" font-weight="700">조건 정의</text><text x="58" y="204" font-size="19">모델 · 하드웨어 · 입력/출력 길이 · 목표 지연</text><rect x="35" y="260" width="690" height="110" rx="16" fill="#e5e8f1"/><text x="58" y="300" font-size="24" font-weight="700">후보 탐색</text><text x="58" y="339" font-size="19">설정 제안 → 실행 → 측정 → 다음 후보 선택</text><rect x="35" y="395" width="690" height="110" rx="16" fill="#eee4df"/><text x="58" y="435" font-size="24" font-weight="700">결과 보존</text><text x="58" y="474" font-size="19">선택된 YAML과 시도별 비교 보고서</text><rect x="35" y="530" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="570" font-size="24" font-weight="700">적용 전 확인</text><text x="58" y="609" font-size="19">새 사용 조건에서도 개선이 유지되는지 재측정</text><text x="40" y="709" font-size="18">발표의 17.5%는 보고된 서빙 개선이며 정답률 향상이 아니다.</text><text x="40" y="737" font-size="16">발표에서 착안한 독자적 설명 도식. 원본 슬라이드가 아니다.</text></g></svg>