<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><title>작은 변경에서 다음 판단의 근거를 얻는다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#476b61"/></marker></defs><rect width="1100" height="700" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="45" y="60" font-size="30" font-weight="700">작은 변경에서 다음 판단의 근거를 얻는다</text><text x="45" y="100" font-size="18">Quinn Slack 발표의 관찰 순환을 단순화한 자체 도식</text><path d="M340 220H395" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="0" y="0" font-size="18"></text><path d="M700 220H755" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="0" y="0" font-size="18"></text><path d="M910 280V445H705" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="805" y="355" font-size="18">문제가 보이면</text><path d="M400 445H190V285" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="210" y="425" font-size="18">관찰 보완</text><rect x="45" y="165" width="290" height="110" rx="15" fill="#d9eae5"/><text x="63" y="203" font-size="23" font-weight="700">1. 관찰 가능한 변경</text><text x="63" y="240" font-size="18">로그로 현재 이해를 확인</text><rect x="405" y="165" width="290" height="110" rx="15" fill="#d9eae5"/><text x="423" y="203" font-size="23" font-weight="700">2. 나란히 비교</text><text x="423" y="240" font-size="18">기존 동작과 새 동작 대조</text><rect x="765" y="165" width="290" height="110" rx="15" fill="#d9eae5"/><text x="783" y="203" font-size="23" font-weight="700">3. 결과 확인</text><text x="783" y="240" font-size="18">다음 변경의 근거로 사용</text><rect x="405" y="390" width="290" height="110" rx="15" fill="#d9eae5"/><text x="423" y="428" font-size="23" font-weight="700">차이가 있거나 불명확</text><text x="423" y="465" font-size="18">추가 조사 · 다음 단계 재검토</text><text x="45" y="595" font-size="20">발표는 관찰을 통한 작은 반복을 설명한다. 자동 안전 보장을 뜻하지 않는다.</text><text x="45" y="628" font-size="20">아래의 중단·재검토 분기는 이 글의 해설이며 실제 운영 절차를 재현하지 않았다.</text></g></svg>