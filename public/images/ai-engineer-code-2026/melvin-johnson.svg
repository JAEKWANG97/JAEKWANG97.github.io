<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="점수와 실제 목표 사이를 검증하기"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">점수와 실제 목표 사이를 검증하기</text><text x="48" y="101" font-size="18">Melvin Johnson 발표를 바탕으로 한 필자의 개념 재구성</text><rect x="48" y="155" width="420" height="110" rx="14" fill="#d9eae5"/><text x="68" y="193" font-size="23" font-weight="700">실제 엔지니어링 목표</text><text x="68" y="229" font-size="19">정확한 변경·적절한 범위·유지 가능성</text><rect x="532" y="155" width="420" height="110" rx="14" fill="#d9eae5"/><text x="552" y="193" font-size="23" font-weight="700">관측할 평가 신호</text><text x="552" y="229" font-size="19">검사·기준표·실행 증거</text><path d="M475 210H520" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="330" width="420" height="135" rx="14" fill="#e1e8e0"/><text x="68" y="368" font-size="23" font-weight="700">실행 검증</text><text x="68" y="404" font-size="19">무엇을 실제로 바꾸고 검사했는가</text><rect x="532" y="330" width="420" height="135" rx="14" fill="#eadfcf"/><text x="552" y="368" font-size="23" font-weight="700">보고 검증</text><text x="552" y="404" font-size="19">주장이 실행 기록과 일치하는가</text><path d="M745 270V315" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M255 270V315" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><text x="48" y="530" font-size="22">보호할 경계: 정답 노출 · 평가기 변경 · 근거 없는 완료 주장</text><text x="48" y="580" font-size="21">높은 점수도, 유창한 설명도 단독으로는 충분한 증거가 아니다.</text></g></svg>