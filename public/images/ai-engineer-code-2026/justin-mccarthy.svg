<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Justin: 보존할 약속과 발견할 수요</title><desc id="desc">생산을 반복하는 일과 무엇을 만들지 배우는 일은 다르다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Justin: 보존할 약속과 발견할 수요</text><text x="35" y="84" font-size="17">생산을 반복하는 일과 무엇을 만들지 배우는 일은 다르다.</text><rect x="40" y="135" width="350" height="140" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">기존 제품</text><text x="58" y="199" font-size="18" font-weight="400">고객 사용 · 문의 · 운영 결과</text><text x="58" y="229" font-size="18" font-weight="400">이미 지키기로 한 약속</text><rect x="430" y="135" width="350" height="140" rx="13" fill="#dfece5"/><text x="448" y="169" font-size="21" font-weight="700">새로운 시장 기회</text><text x="448" y="199" font-size="18" font-weight="400">아직 답하지 못한 수요</text><text x="448" y="229" font-size="18" font-weight="400">질문 · 반응 · 실험</text><path d="M215,275 L215,340" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M605,275 L605,340" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="350" width="350" height="170" rx="13" fill="#dfece5"/><text x="58" y="384" font-size="21" font-weight="700">브라운필드 반복</text><text x="58" y="414" font-size="18" font-weight="400">행동을 유지하며 개선</text><text x="58" y="444" font-size="18" font-weight="400">성능 · 비용 · 보안 확인</text><text x="58" y="474" font-size="18" font-weight="400">다른 약속을 잃지 않는가?</text><rect x="430" y="350" width="350" height="170" rx="13" fill="#dfece5"/><text x="448" y="384" font-size="21" font-weight="700">수요 탐색 반복</text><text x="448" y="414" font-size="18" font-weight="400">무엇을 물을지 선택</text><text x="448" y="444" font-size="18" font-weight="400">고객 반응을 종합</text><text x="448" y="474" font-size="18" font-weight="400">다음 실험을 정하기</text><path d="M215,520 L215,580" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M605,520 L605,580" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="590" width="350" height="125" rx="13" fill="#dfece5"/><text x="58" y="624" font-size="21" font-weight="700">확인할 결과</text><text x="58" y="654" font-size="18" font-weight="400">기존 약속이 유지됐는가?</text><rect x="430" y="590" width="350" height="125" rx="13" fill="#dfece5"/><text x="448" y="624" font-size="21" font-weight="700">확인할 결과</text><text x="448" y="654" font-size="18" font-weight="400">고객이 실제로 원하는가?</text><text x="40" y="780" font-size="18">수요 공장은 발표자의 구상이며 완성된 운영 시스템이 아니다.</text><text x="40" y="830" font-size="18">자체 설명도. 두 흐름의 성공 기준을 구분하기 위한 재구성.</text></g></svg>