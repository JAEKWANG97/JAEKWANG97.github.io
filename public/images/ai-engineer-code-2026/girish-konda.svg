<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Girish: 실패 유형마다 다른 경계</title><desc id="desc">하나의 주의 문구로 해결할 수 없는 세 가지 사례.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Girish: 실패 유형마다 다른 경계</text><text x="35" y="84" font-size="17">하나의 주의 문구로 해결할 수 없는 세 가지 사례.</text><rect x="40" y="135" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">설명용: 공유 추측</text><text x="58" y="199" font-size="18" font-weight="400">검증 안 된 80% 개선 주장</text><text x="58" y="229" font-size="18" font-weight="400">여러 에이전트가 반복</text><rect x="430" y="135" width="350" height="145" rx="13" fill="#dfece5"/><text x="448" y="169" font-size="21" font-weight="700">필요한 검사</text><text x="448" y="199" font-size="18" font-weight="400">독립 관측인지 출처 확인</text><text x="448" y="229" font-size="18" font-weight="400">같은 근거를 중복 집계 금지</text><path d="M390,207 L425,207" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="330" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="364" font-size="21" font-weight="700">설명용: PR 응답 유실</text><text x="58" y="394" font-size="18" font-weight="400">실행 뒤 답이 오지 않음</text><text x="58" y="424" font-size="18" font-weight="400">이미 생성됐을 수 있음</text><rect x="430" y="330" width="350" height="145" rx="13" fill="#dfece5"/><text x="448" y="364" font-size="21" font-weight="700">필요한 검사</text><text x="448" y="394" font-size="18" font-weight="400">결과 불명 상태를 유지</text><text x="448" y="424" font-size="18" font-weight="400">재실행 전에 외부 효과 조회</text><path d="M390,402 L425,402" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="525" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="559" font-size="21" font-weight="700">실제: 공유 캐시 충돌</text><text x="58" y="589" font-size="18" font-weight="400">여러 서버의 동시 초기화</text><text x="58" y="619" font-size="18" font-weight="400">개별 요청은 정상</text><rect x="430" y="525" width="350" height="145" rx="13" fill="#dfece5"/><text x="448" y="559" font-size="21" font-weight="700">필요한 검사</text><text x="448" y="589" font-size="18" font-weight="400">공유 자원별 실행 수 제어</text><text x="448" y="619" font-size="18" font-weight="400">대기 · 거부 결과도 명시</text><path d="M390,597 L425,597" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="738" font-size="18">SAFE: 출처 있는 읽기 · 실행 규율 · 작업 예산 · 명시적 결과</text><text x="40" y="786" font-size="18">단일 조정자 전제. 진실성·정확히 한 번 실행·자동 복구 보장 아님.</text><text x="40" y="838" font-size="18">자체 설명도. 실제 프로젝트 경험과 설명용 예를 구분했다.</text></g></svg>