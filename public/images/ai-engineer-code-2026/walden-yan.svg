<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="문제를 해결하고, 다음 작업의 비용도 줄이기"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">문제를 해결하고, 다음 작업의 비용도 줄이기</text><text x="48" y="101" font-size="18">Walden Yan 발표를 바탕으로 한 필자의 개념 재구성</text><text x="48" y="150" font-size="22">고객 문제 해결</text><rect x="48" y="175" width="250" height="105" rx="14" fill="#d9eae5"/><text x="68" y="213" font-size="23" font-weight="700">실패 재현</text><text x="68" y="249" font-size="19">관찰 가능한 문제</text><rect x="375" y="175" width="250" height="105" rx="14" fill="#d9eae5"/><text x="395" y="213" font-size="23" font-weight="700">수정과 검사</text><text x="395" y="249" font-size="19">동작을 바꾼 증거</text><rect x="702" y="175" width="250" height="105" rx="14" fill="#d9eae5"/><text x="722" y="213" font-size="23" font-weight="700">결과 확인</text><text x="722" y="249" font-size="19">고객 경험으로 연결</text><path d="M300 225H360" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M630 225H690" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><text x="48" y="352" font-size="22">작업 환경 개선</text><rect x="48" y="380" width="250" height="105" rx="14" fill="#d9eae5"/><text x="68" y="418" font-size="23" font-weight="700">실행 기록</text><text x="68" y="454" font-size="19">반복된 준비·실패</text><rect x="375" y="380" width="250" height="105" rx="14" fill="#d9eae5"/><text x="395" y="418" font-size="23" font-weight="700">환경·절차 개선</text><text x="395" y="454" font-size="19">재사용할 검사와 도구</text><rect x="702" y="380" width="250" height="105" rx="14" fill="#d9eae5"/><text x="722" y="418" font-size="23" font-weight="700">다음 실행</text><text x="722" y="454" font-size="19">같은 준비 비용 줄이기</text><path d="M300 430H360" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M630 430H690" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M500 285V365" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><text x="520" y="329" font-size="20">수정 과정도 관찰</text><text x="48" y="575" font-size="21">검증 경계: 모의 환경 통과 ≠ 실제 외부 서비스와의 완전한 호환성</text></g></svg>