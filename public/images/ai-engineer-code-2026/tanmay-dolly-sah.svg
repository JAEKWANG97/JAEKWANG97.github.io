<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>실패한 위치에 따라 복구의 의미가 달라진다</title><desc>오류 메시지가 같아도 실제 반영 상태는 다를 수 있다 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">실패한 위치에 따라 복구의 의미가 달라진다</text><text x="45" y="90" font-size="17" fill="#52647b">오류 메시지가 같아도 실제 반영 상태는 다를 수 있다 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">장애 위치</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">변경 전</text><text x="63.0" y="220" font-size="16" fill="#52647b">외부 효과 없음 확인</text><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">부분 반영 중</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">완료 단계·남은 효과 확인</text><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">반영 후 응답 유실</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">객체·처리 상태 조회</text><text x="45" y="305" font-size="18" font-weight="700">대응 후보</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">재시도 후보</text><text x="63.0" y="380" font-size="16" fill="#52647b">안전한 재실행 조건 확인</text><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">복원 또는 보상</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">이전 상태·다른 변경 확인</text><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">완료 인정 후보</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">중복 실행을 피함</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">복구 성공은 주장만으로 확정하지 않는다. 최종 상태와 외부 효과 이력을 별도로 검증한다.</text><path d="M215 268V315" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><path d="M600 268V315" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><path d="M985 268V315" fill="none" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/></g></svg>