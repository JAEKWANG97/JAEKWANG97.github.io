<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>수신함과 작업 이력과 모델 문맥의 구분</title><rect width="1200" height="650" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.t{font-size:31px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:20px}.s{font-size:19px;fill:#617782}</style><text x="50" y="65" class="t">도착한 메시지, 처리한 기록, 지금 볼 문맥을 나눈다</text><text x="50" y="108" class="s">Lovable 런타임의 역할을 재구성한 자체 설명도</text><rect x="50" y="170" width="340" height="180" rx="14" fill="white" stroke="#147d83" stroke-width="2"/><text x="70" y="215" class="h">수신함</text><text x="70" y="265" class="b">외부에서 도착한 메시지</text><text x="70" y="300" class="b">언제든 저장 가능</text><rect x="430" y="170" width="340" height="180" rx="14" fill="white" stroke="#147d83" stroke-width="2"/><text x="450" y="215" class="h">작업 이력</text><text x="450" y="265" class="b">실제로 처리한 순서</text><text x="450" y="300" class="b">반복 경계에서 반영</text><rect x="810" y="170" width="340" height="180" rx="14" fill="white" stroke="#147d83" stroke-width="2"/><text x="830" y="215" class="h">모델 문맥</text><text x="830" y="265" class="b">현재 판단에 필요한 표현</text><text x="830" y="300" class="b">이력으로부터 구성</text><text x="400" y="270" class="h">→</text><text x="780" y="270" class="h">→</text><rect x="50" y="400" width="1100" height="130" rx="14" fill="white" stroke="#c57831" stroke-width="2"/><text x="75" y="445" class="h">실행자는 교체 가능</text><text x="75" y="490" class="b">기록을 바탕으로 다음 작업을 이어간다. 컴퓨터 상태의 복구는 별도 책임이다.</text><text x="50" y="590" class="s">깨우기 신호 ≠ 메시지 본문 · 기록 보존 ≠ 외부 행동의 중복 방지</text></svg>