<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="검증 결과에는 ‘증거 없음’도 필요하다"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">검증 결과에는 ‘증거 없음’도 필요하다</text><text x="48" y="101" font-size="18">Dmitry Buykin 발표와 변이 테스트 개념을 연결한 필자의 해석</text><rect x="48" y="155" width="420" height="110" rx="14" fill="#d9eae5"/><text x="68" y="193" font-size="23" font-weight="700">정상 작업 재생</text><text x="68" y="229" font-size="19">기대 동작을 유지하는가</text><rect x="532" y="155" width="420" height="110" rx="14" fill="#eadfcf"/><text x="552" y="193" font-size="23" font-weight="700">의도적 결함 재생</text><text x="552" y="229" font-size="19">검사가 문제를 잡는가</text><path d="M260 270V320" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M740 270V320" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="340" width="904" height="90" rx="14" fill="#badbd0"/><text x="68" y="378" font-size="23" font-weight="700">실행 결과와 기대 판정을 비교한다</text><rect x="48" y="475" width="275" height="100" rx="14" fill="#d9eae5"/><text x="68" y="513" font-size="23" font-weight="700">성공</text><text x="68" y="549" font-size="19">실행했고 기대와 일치</text><rect x="363" y="475" width="275" height="100" rx="14" fill="#f1d3b5"/><text x="383" y="513" font-size="23" font-weight="700">실패</text><text x="383" y="549" font-size="19">실행했고 기대와 불일치</text><rect x="678" y="475" width="275" height="100" rx="14" fill="#e1e8e0"/><text x="698" y="513" font-size="23" font-weight="700">증거 없음</text><text x="698" y="549" font-size="19">해당 경로를 확인 못 함</text><text x="48" y="620" font-size="20">검사를 지나갔다는 사실과, 결함을 탐지한다는 사실은 다르다.</text></g></svg>