<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>과제를 푸는 루프와 실행 틀을 고치는 루프</title><desc>두 루프의 결과를 같은 점수 하나로 뭉치지 않는다 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">과제를 푸는 루프와 실행 틀을 고치는 루프</text><text x="45" y="90" font-size="17" fill="#52647b">두 루프의 결과를 같은 점수 하나로 뭉치지 않는다 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">과제 실행</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">고정된 과제</text><text x="63.0" y="220" font-size="16" fill="#52647b">환경·입력·제약</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">에이전트 실행</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">도구·출력·시간·비용</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">관측 결과</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">성공 / 실패 / 무효</text><text x="45" y="305" font-size="18" font-weight="700">개선 실험</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">실패 분류</text><text x="63.0" y="380" font-size="16" fill="#52647b">모델 / 도구 / 실행 결함</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">수정안 비교</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">변경 이력·실험 비용</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">별도 확인</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">반복성·회귀·예산</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">평가 기준은 개선 대상과 분리한다. 최고 점수, 반복 결과, 전체 탐색 비용을 따로 기록한다.</text></g></svg>