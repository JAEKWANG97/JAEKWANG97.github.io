<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1050" viewBox="0 0 760 1050" role="img" aria-labelledby="title desc"><title id="title">Dune 사례의 두 가지 제약</title><desc id="desc">첫째, 제품 코드의 useEffect 직접 사용을 제한하고 Dune 내부 일부에서 허용한다. 둘째, main과 renderer 디렉터리로 역할을 드러내고 검사기로 허용하지 않은 import를 막는다.</desc><rect width="760" height="1050" rx="20" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#252724"><text x="40" y="55" font-size="19" fill="#85522f">LAUREN TAN / DUNE</text><text x="40" y="108" font-size="34" font-weight="700">사용 경로와 의존성 경계를 제한한다</text><rect x="40" y="155" width="680" height="365" rx="14" fill="#fffdf8" stroke="#d5d3c8"/><text x="65" y="205" font-size="28" font-weight="700">A. useEffect의 사용 위치</text><rect x="65" y="235" width="630" height="95" rx="10" fill="#f3e6de"/><text x="87" y="273" font-size="25" font-weight="650">제품 코드에서 직접 사용: 제한</text><text x="87" y="309" font-size="22" fill="#62665e">각 제품 기능에 사용 책임을 흩어 놓지 않는다.</text><path d="M380 343v27m-7-7 7 7 7-7" fill="none" stroke="#85522f" stroke-width="2.5"/><rect x="65" y="383" width="630" height="100" rx="10" fill="#e9eee6"/><text x="87" y="422" font-size="25" font-weight="650">Dune API 내부 일부: 허용</text><text x="87" y="459" font-size="22" fill="#62665e">제품 코드는 프레임워크의 지원 경로를 사용한다.</text><rect x="40" y="550" width="680" height="340" rx="14" fill="#fffdf8" stroke="#d5d3c8"/><text x="65" y="600" font-size="28" font-weight="700">B. main과 renderer의 의존성</text><rect x="65" y="630" width="630" height="80" rx="10" fill="#e9eee6"/><text x="87" y="665" font-size="24" font-weight="650">electron-main / electron-renderer</text><text x="87" y="696" font-size="22" fill="#62665e">디렉터리 이름으로 코드의 역할을 드러낸다.</text><path d="M380 721v25m-7-7 7 7 7-7" fill="none" stroke="#85522f" stroke-width="2.5"/><rect x="65" y="762" width="630" height="93" rx="10" fill="#f3e6de"/><text x="87" y="799" font-size="25" font-weight="650">의존성 분석기 + 린트 규칙</text><text x="87" y="834" font-size="22" fill="#62665e">허용하지 않은 import를 검사하고 막는다.</text><text x="40" y="950" font-size="24" fill="#85522f">해당 팀의 설계 선택이다. 보편적 금지 규칙은 아니다.</text><text x="40" y="1005" font-size="20" fill="#62665e">발표 사례를 재구성한 도식 · 실제 내부 구조도 아님</text></g></svg>
