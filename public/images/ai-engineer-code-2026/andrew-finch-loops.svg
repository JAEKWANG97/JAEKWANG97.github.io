<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680"><rect width="1200" height="680" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.t{font-size:31px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:21px}.s{font-size:19px;fill:#617782}</style><text x="50" y="65" class="t">같은 검사를 반복하지 않고, 다른 시점의 증거를 본다</text><text x="50" y="106" class="s">Andrew Finch의 네 순환을 재구성한 설명용 도식</text><rect x="50" y="150" width="525" height="180" rx="14" fill="white" stroke="#147d83" stroke-width="3"/><text x="75" y="195" class="h">① PR 검사</text><text x="75" y="240" class="b">변경을 받아들이기 전</text><text x="75" y="276" class="b">요구사항·충돌·위험·근거</text><rect x="625" y="150" width="525" height="180" rx="14" fill="white" stroke="#486aa6" stroke-width="3"/><text x="650" y="195" class="h">② 배포 후 검증</text><text x="650" y="240" class="b">실제 환경에 적용한 뒤</text><text x="650" y="276" class="b">운영 동작이 예상과 같은가</text><rect x="50" y="370" width="525" height="180" rx="14" fill="white" stroke="#c57831" stroke-width="3"/><text x="75" y="415" class="h">③ 유지보수</text><text x="75" y="460" class="b">시간이 지나 조건이 바뀐 뒤</text><text x="75" y="496" class="b">새 취약점·규칙·누적 복잡성</text><rect x="625" y="370" width="525" height="180" rx="14" fill="white" stroke="#866799" stroke-width="3"/><text x="650" y="415" class="h">④ 지식 갱신</text><text x="650" y="460" class="b">검토와 운영에서 배운 내용</text><text x="650" y="496" class="b">정리한 맥락을 다른 과정으로</text><text x="50" y="620" class="s">사람의 역할: 기준과 의도를 정하고, 중요한 근거와 예외를 검토한다.</text></svg>