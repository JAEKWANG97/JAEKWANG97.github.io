<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Ankit: 같은 출발점, 다른 가설</title><desc id="desc">발표의 개념을 재구성했다. 제품의 전체 격리 보장도가 아니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Ankit: 같은 출발점, 다른 가설</text><text x="35" y="84" font-size="17">발표의 개념을 재구성했다. 제품의 전체 격리 보장도가 아니다.</text><rect x="190" y="120" width="440" height="110" rx="13" fill="#dfece5"/><text x="208" y="154" font-size="21" font-weight="700">공통 출발 상태</text><text x="208" y="184" font-size="18" font-weight="400">대화 · 기억 · 데이터 · 파일</text><path d="M310,230 L205,290" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M510,230 L615,290" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="300" width="350" height="140" rx="13" fill="#dfece5"/><text x="58" y="334" font-size="21" font-weight="700">실험 A</text><text x="58" y="364" font-size="18" font-weight="400">가설 A에 맞춰 변경·실행</text><text x="58" y="394" font-size="18" font-weight="400">A의 변경을 다른 실험과 격리</text><rect x="430" y="300" width="350" height="140" rx="13" fill="#dfece5"/><text x="448" y="334" font-size="21" font-weight="700">실험 B</text><text x="448" y="364" font-size="18" font-weight="400">가설 B에 맞춰 변경·실행</text><text x="448" y="394" font-size="18" font-weight="400">B의 변경을 다른 실험과 격리</text><rect x="40" y="490" width="740" height="90" rx="13" fill="#ede2cb"/><text x="58" y="524" font-size="21" font-weight="700">격리 밖의 영향은 별도 확인</text><text x="58" y="554" font-size="18" font-weight="400">공유 파일 · 외부 API · 메시지 전송</text><path d="M205,440 L205,478" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M615,440 L615,478" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M410,580 L410,625" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="120" y="635" width="580" height="110" rx="13" fill="#dfece5"/><text x="138" y="669" font-size="21" font-weight="700">공통 기억으로 받아들이기 전 검토</text><text x="138" y="699" font-size="18" font-weight="400">실험에서 얻은 판단 ≠ 팀 전체의 확정 사실</text><text x="40" y="808" font-size="18">핵심: 작업 상태의 격리와 판단의 채택은 서로 다른 문제다.</text><text x="40" y="850" font-size="18">조사 대상 서비스의 분기는 가능한 경우에만 해당한다.</text></g></svg>