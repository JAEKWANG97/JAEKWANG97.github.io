<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>검증의 층: 실행 경로, 입력, 검사기, 배포물</title><rect width="1200" height="820" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" fill="#183c37"><text x="60" y="62" font-size="30" font-weight="700">검증의 층: 실행 경로, 입력, 검사기, 배포물</text><text x="60" y="103" font-size="19">Jarred Sumner · 발표와 추가 자료의 관계를 정리한 자체 해설</text><rect x="60" y="140" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="175" font-size="19" font-weight="700">같은 입력을 비교한다</text><text x="85" y="219" font-size="25">JIT · AOT · 타입 제거 경로</text><text x="585" y="219" font-size="25">출력의 차이 → 재현 가능한 결함 후보</text><rect x="60" y="300" width="1080" height="124" rx="16" fill="#e7e7db"/><text x="85" y="335" font-size="19" font-weight="700">다른 입력을 탐색한다</text><text x="85" y="379" font-size="25">기존 테스트 · 퍼징</text><text x="585" y="379" font-size="25">이미 알려진 동작 + 새로운 경계 조건</text><rect x="60" y="460" width="1080" height="124" rx="16" fill="#ede2cb"/><text x="85" y="495" font-size="19" font-weight="700">검사 자체를 점검한다</text><text x="85" y="539" font-size="25">결함을 발견할 수 있는가</text><text x="585" y="539" font-size="25">통과만 반복하는 검사와 구분</text><rect x="60" y="620" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="655" font-size="19" font-weight="700">배포 경로를 점검한다</text><text x="85" y="699" font-size="25">테스트 환경의 예외 확인</text><text x="585" y="699" font-size="25">최종 실행 파일에서도 다시 검증</text></g></svg>