<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Thariq: 엔진은 위임하고 행동은 직접 조율</title><desc id="desc">읽기 쉬운 실행 코드가 창작자가 이해하고 바꾸는 작업면이 된다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Thariq: 엔진은 위임하고 행동은 직접 조율</text><text x="35" y="84" font-size="17">읽기 쉬운 실행 코드가 창작자가 이해하고 바꾸는 작업면이 된다.</text><rect x="100" y="130" width="620" height="110" rx="13" fill="#dfece5"/><text x="118" y="164" font-size="21" font-weight="700">에이전트가 다루는 엔진·기본 요소</text><text x="118" y="194" font-size="18" font-weight="400">카메라 등 내부 구현과 복잡한 기능의 기반</text><path d="M410,240 L410,305" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="315" width="620" height="140" rx="13" fill="#dfece5"/><text x="118" y="349" font-size="21" font-weight="700">사람이 읽는 행동 코드</text><text x="118" y="379" font-size="18" font-weight="400">캐릭터 능력 · 돌의 크기 · 단위가 드러나는 표현</text><text x="118" y="409" font-size="18" font-weight="400">작성 규칙과 린트로 읽을 수 있는 형태 유지</text><path d="M300,455 L205,520" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M520,455 L615,520" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="530" width="350" height="115" rx="13" fill="#dfece5"/><text x="58" y="564" font-size="21" font-weight="700">직접 편집</text><text x="58" y="594" font-size="18" font-weight="400">IDE에서 작은 값을 바꾸기</text><rect x="430" y="530" width="350" height="115" rx="13" fill="#dfece5"/><text x="448" y="564" font-size="21" font-weight="700">직접 플레이</text><text x="448" y="594" font-size="18" font-weight="400">동작과 느낌이 맞는지 보기</text><path d="M390,587 L425,587" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="700" width="620" height="95" rx="13" fill="#ede2cb"/><text x="118" y="734" font-size="21" font-weight="700">새 기본 요소가 필요하면 에이전트에 다시 요청</text><text x="118" y="764" font-size="18" font-weight="400">역할 분담은 고정된 정답이 아니라 진행 중인 실험</text><text x="40" y="850" font-size="18">자체 개념도. 실행 코드와 별도 설명 문서를 혼동하지 않는다.</text></g></svg>