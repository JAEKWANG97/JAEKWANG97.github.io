<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>테스트 파일 생성이 아니라 PR의 생명주기를 관리한다</title><desc>현재 상태에 맞는 다음 행동을 하나씩 선택한다 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">테스트 파일 생성이 아니라 PR의 생명주기를 관리한다</text><text x="45" y="90" font-size="17" fill="#52647b">현재 상태에 맞는 다음 행동을 하나씩 선택한다 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">생성과 전달</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">대상 선정</text><text x="63.0" y="220" font-size="16" fill="#52647b">적합성·중복·재선정 조건</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">생성 + 검증</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">환경에서 확인·CI 결과</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">사람의 리뷰</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">승인 후 병합</text><text x="45" y="305" font-size="18" font-weight="700">현재 PR 상태별 선택지 · 아래 칸은 순서가 아님</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">CI 진행 중</text><text x="63.0" y="380" font-size="16" fill="#52647b">다음 주기에 다시 확인</text><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">수정 가능 실패</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">제한된 횟수로 개선</text><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">반복 실패·방치</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">닫기·원인 기록·재선정 지연</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">형식 오류, 환경 문제, 설계 제약을 구분한다. 테스트를 통과시키려고 제품 행동을 몰래 바꾸지 않는다.</text></g></svg>