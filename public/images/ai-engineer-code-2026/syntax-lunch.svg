<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><title>상태 이름뿐 아니라 가능한 이동을 정한다</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#476b61"/></marker></defs><rect width="1100" height="700" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="45" y="60" font-size="30" font-weight="700">상태 이름뿐 아니라 가능한 이동을 정한다</text><text x="45" y="100" font-size="18">자체 예제: 동시에 한 요청만 처리하는 화면 · 취소와 동시성은 생략</text><path d="M280 235H410" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="325" y="215" font-size="18">시작</text><path d="M675 215H815" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="725" y="195" font-size="18">성공</text><path d="M675 250H745V435H815" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="750" y="345" font-size="18">실패</text><path d="M820 455H545V300" fill="none" stroke="#476b61" stroke-width="2.5" marker-end="url(#a)"/><text x="635" y="480" font-size="18">재시도</text><rect x="45" y="180" width="230" height="110" rx="15" fill="#d9eae5"/><text x="63" y="218" font-size="23" font-weight="700">대기</text><text x="63" y="255" font-size="18">요청 전</text><rect x="420" y="180" width="250" height="110" rx="15" fill="#d9eae5"/><text x="438" y="218" font-size="23" font-weight="700">실행 중</text><text x="438" y="255" font-size="18">현재 요청 하나</text><rect x="825" y="150" width="230" height="110" rx="15" fill="#d9eae5"/><text x="843" y="188" font-size="23" font-weight="700">완료</text><text x="843" y="225" font-size="18">성공 응답</text><rect x="825" y="380" width="230" height="110" rx="15" fill="#d9eae5"/><text x="843" y="418" font-size="23" font-weight="700">오류</text><text x="843" y="455" font-size="18">실패 응답</text><text x="45" y="595" font-size="20">이 모델에서는 완료와 실행 중을 동시에 선택하지 않는다.</text><text x="45" y="628" font-size="20">오래된 응답 · 취소 · 병렬 요청이 필요하면 별도의 규칙을 추가한다.</text><text x="45" y="661" font-size="20">파일 접근 계층을 우회하지 못하게 하는 린트는 상태 전이와 다른 종류의 제약이다.</text></g></svg>