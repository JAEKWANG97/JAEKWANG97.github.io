<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>작업실의 기준: 생산량이 아니라 선택의 품질</title><rect width="1200" height="820" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" fill="#183c37"><text x="60" y="62" font-size="30" font-weight="700">작업실의 기준: 생산량이 아니라 선택의 품질</text><text x="60" y="103" font-size="19">Armin Ronacher · 발표와 추가 자료의 관계를 정리한 자체 해설</text><rect x="60" y="140" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="175" font-size="19" font-weight="700">발표의 문제</text><text x="85" y="219" font-size="25">실행 능력은 커진다</text><text x="585" y="219" font-size="25">지속적인 관심은 자동으로 늘지 않는다</text><rect x="60" y="300" width="1080" height="124" rx="16" fill="#e7e7db"/><text x="85" y="335" font-size="19" font-weight="700">장시간 실험이 보여 준 간극</text><text x="85" y="379" font-size="25">많은 코드 · 긴 실행</text><text x="585" y="379" font-size="25">읽기 쉬움 · 설계의 일관성은 별도</text><rect x="60" y="460" width="1080" height="124" rx="16" fill="#ede2cb"/><text x="85" y="495" font-size="19" font-weight="700">Deser가 보여 준 선택</text><text x="85" y="539" font-size="25">특정 문제를 더 잘 해결</text><text x="585" y="539" font-size="25">지원 범위 · 성능 · 생태계 비용 수용</text><rect x="60" y="620" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="655" font-size="19" font-weight="700">이 글의 종합</text><text x="85" y="699" font-size="25">무엇을 만들 것인가</text><text x="585" y="699" font-size="25">왜 그렇게 만들고 어떻게 돌볼 것인가</text></g></svg>