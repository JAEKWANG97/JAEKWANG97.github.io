<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" role="img" aria-labelledby="t d"><title id="t">소프트웨어 공장의 두 방향 압력</title><desc id="d">요청과 장애는 구현을 시작시킨다. 검사 실패는 수정을 요구한다. 통과한 결과를 사람이 판단하고 배포한 뒤 사용자 피드백으로 돌아온다. 검사 통과가 유지보수성을 보장하지는 않는다.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#366b64"/></marker></defs><rect width="760" height="860" rx="24" fill="#f7f4ed"/><g font-family="sans-serif" fill="#203638"><text x="40" y="56" font-size="29" font-weight="700">일을 만드는 힘과, 기준을 지키는 힘</text><text x="40" y="90" font-size="19">Dexter Horthy 발표에서 착안한 독자적 설명</text><rect x="50" y="130" width="660" height="92" rx="15" fill="#e4eeea"/><text x="75" y="165" font-size="24" font-weight="700">전방 압력: 요청 · 장애 · 개선 목표</text><text x="75" y="198" font-size="20">무엇을 만들어야 하는가?</text><rect x="50" y="268" width="285" height="115" rx="15" fill="#e5e8f1"/><text x="77" y="310" font-size="25" font-weight="700">구현과 수정</text><text x="77" y="348" font-size="20">에이전트가 변경을 만든다</text><rect x="425" y="268" width="285" height="115" rx="15" fill="#e4eeea"/><text x="451" y="310" font-size="25" font-weight="700">검사</text><text x="451" y="348" font-size="20">타입 · 린트 · 테스트</text><g stroke="#366b64" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M192 222V259"/><path d="M336 322H416"/><path d="M568 384V438H192V392"/></g><text x="440" y="427" font-size="18">실패</text><text x="240" y="470" font-size="20">실패 내용만 돌려주고 다시 수정</text><rect x="50" y="510" width="660" height="108" rx="15" fill="#fff"/><text x="75" y="549" font-size="24" font-weight="700">검사 통과 후에도 남는 판단</text><text x="75" y="584" font-size="20">문제를 제대로 풀었나? 배포해도 되나? 다음 변경은?</text><path d="M568 383V500" fill="none" stroke="#366b64" stroke-width="3" marker-end="url(#a)"/><text x="582" y="423" font-size="18">통과</text><rect x="50" y="662" width="660" height="82" rx="15" fill="#e4eeea"/><text x="75" y="696" font-size="23" font-weight="700">배포 → 사용자 반응 → 다음 요청</text><text x="75" y="725" font-size="19">생성량이 아니라 실제 결과로 순환을 닫는다</text><path d="M380 619V652" fill="none" stroke="#366b64" stroke-width="3" marker-end="url(#a)"/><text x="50" y="793" font-size="20" font-weight="700">주의: 테스트 통과 ≠ 유지보수성의 완전한 보장</text><text x="50" y="827" font-size="17">실제 서비스 구성도나 원본 슬라이드가 아니다.</text></g></svg>
