<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title desc"><title id="title">개별 변경과 전체 작업을 나눈 두 루프</title><desc id="desc">외부 루프는 작업 선택, 예산, 권한, 재시도를 관리하고 내부 루프는 재현, 구현, 검증, 수정을 수행한다. 확인된 근거로 다음 작업을 결정한다.</desc><rect width="760" height="980" rx="20" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#252724"><text x="40" y="60" font-size="19" fill="#85522f">LAUREN TAN / EXPLANATORY MODEL</text><text x="40" y="115" font-size="34" font-weight="700">더 자주 실행하기 전에, 잘 끝내기</text><rect x="40" y="170" width="680" height="170" rx="14" fill="#e9eee6" stroke="#c6d0c0"/><text x="65" y="215" font-size="29" font-weight="700">외부 루프: 일을 운영한다</text><text x="65" y="262" font-size="25">작업 선택 · 우선순위 · 동시 실행 예산</text><text x="65" y="305" font-size="25">권한 · 재시도 한도 · 종료 조건</text><path d="M380 350v40m-8-8 8 8 8-8" fill="none" stroke="#85522f" stroke-width="3"/><rect x="80" y="410" width="600" height="290" rx="14" fill="#fffdf8" stroke="#d5d3c8"/><text x="105" y="458" font-size="29" font-weight="700">내부 루프: 변경을 검증한다</text><text x="105" y="515" font-size="26">재현 → 작은 구현 → 검사와 실행</text><text x="105" y="565" font-size="26">실패하면 원인을 확인하고 수정</text><path d="M595 580v50H145v-40m-7 8 7-8 7 8" fill="none" stroke="#85522f" stroke-width="2"/><text x="105" y="673" font-size="23" fill="#62665e">대상 버전 · 입력 · 결과 · 미확인 범위</text><path d="M380 710v40m-8-8 8 8 8-8" fill="none" stroke="#85522f" stroke-width="3"/><text x="70" y="800" font-size="27" font-weight="650">검증 근거로 계속 / 중단 / 사람 판단</text><text x="40" y="885" font-size="23" fill="#85522f">반복 횟수와 변경의 신뢰도는 다른 문제입니다.</text><text x="40" y="938" font-size="20" fill="#62665e">독자적 운영 해설 · 공식 발표 도표가 아닙니다.</text></g></svg>