<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>main의 최신 위치와 검증된 위치를 분리한다</title><desc>단일 이력 위의 두 기준점 · 필자 설명용 가상 커밋</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">main의 최신 위치와 검증된 위치를 분리한다</text><text x="45" y="90" font-size="17" fill="#52647b">단일 이력 위의 두 기준점 · 필자 설명용 가상 커밋</text><text x="45" y="145" font-size="18" font-weight="700">코드 이력</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">A</text><text x="63.0" y="220" font-size="16" fill="#52647b">검증 통과</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">B</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">새 변경 · 검증 실패</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">C</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">추가 수정 · 검증 통과</text><text x="45" y="305" font-size="18" font-weight="700">검증 참조</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">A를 가리킴</text><text x="63.0" y="380" font-size="16" fill="#52647b">사용 가능한 기준점</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">여전히 A</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">B를 통과로 취급하지 않음</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">C로 전진</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">C의 누적 상태를 확인</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">병합 속도와 검증 완료 속도를 따로 본다. 참조가 멈춘 시간도 운영 비용이다.</text></g></svg>