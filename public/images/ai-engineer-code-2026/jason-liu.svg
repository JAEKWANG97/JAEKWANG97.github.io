<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">결과물을 얻는 일과 판단을 기르는 일</title><desc id="d">만들기와 책임, 결과 받기와 경험하기, 취향과 검증의 차이를 비교한다.</desc><rect width="1000" height="620" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="65" font-size="31" font-weight="700">빠르게 얻을 수 있는 것, 직접 길러야 할 것</text><text x="48" y="105" font-size="19">Jason Liu의 발표와 에세이를 바탕으로 한 필자의 해석</text><g font-size="25"><rect x="48" y="145" width="904" height="110" rx="16" fill="#e1e8e0"/><text x="72" y="187">제작 도구와 실행 능력</text><text x="72" y="226" font-size="20">무엇을 만들 수 있는가</text><text x="520" y="187" font-weight="700">제작자의 선택과 책임</text><text x="520" y="226" font-size="20">무엇을 내보낼 것인가</text><rect x="48" y="280" width="904" height="110" rx="16" fill="#d9eae5"/><text x="72" y="322">완성된 결과 받기</text><text x="72" y="361" font-size="20">목적지에 빨리 도착하기</text><text x="520" y="322" font-weight="700">차이를 관찰하고 설명하기</text><text x="520" y="361" font-size="20">다음 선택의 기준 기르기</text><rect x="48" y="415" width="904" height="110" rx="16" fill="#eadfcf"/><text x="72" y="457">좋아 보인다는 판단</text><text x="72" y="496" font-size="20">선호와 의도를 표현하기</text><text x="520" y="457" font-weight="700">별도로 필요한 검증</text><text x="520" y="496" font-size="20">정확성·안전성은 증거로 확인하기</text></g><text x="48" y="578" font-size="21">자동화를 줄이라는 뜻이 아니라, 배울 경험을 남기자는 해석이다.</text></g></svg>