<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Ishaan: 더 나은 제품은 더 많은 화면인가</title><desc id="desc">세 제품 판단을 대비한 설명도. 실제 Antigravity 화면은 아니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Ishaan: 더 나은 제품은 더 많은 화면인가</text><text x="35" y="84" font-size="17">세 제품 판단을 대비한 설명도. 실제 Antigravity 화면은 아니다.</text><rect x="40" y="135" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">입력 대기열</text><text x="58" y="199" font-size="18" font-weight="400">작은 요청을 순서대로 전달</text><rect x="430" y="135" width="350" height="145" rx="13" fill="#ede2cb"/><text x="448" y="169" font-size="21" font-weight="700">다시 물을 질문</text><text x="448" y="199" font-size="18" font-weight="400">지금 의도를 알아야 더 잘 조율할까?</text><path d="M390,207 L425,207" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="340" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="374" font-size="21" font-weight="700">사용자의 확장 기능</text><text x="58" y="404" font-size="18" font-weight="400">개인 · 팀 · 과학 분야의 도구</text><rect x="430" y="340" width="350" height="145" rx="13" fill="#ede2cb"/><text x="448" y="374" font-size="21" font-weight="700">제품으로 가져오기 전</text><text x="448" y="404" font-size="18" font-weight="400">누구에게 반복해서 필요한가?</text><path d="M390,412 L425,412" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="545" width="350" height="145" rx="13" fill="#dfece5"/><text x="58" y="579" font-size="21" font-weight="700">에이전트 관리 화면</text><text x="58" y="609" font-size="18" font-weight="400">세부 호출과 제어 항목을 더하기</text><rect x="430" y="545" width="350" height="145" rx="13" fill="#ede2cb"/><text x="448" y="579" font-size="21" font-weight="700">다시 물을 질문</text><text x="448" y="609" font-size="18" font-weight="400">지금 필요한 상태가 더 잘 보이는가?</text><path d="M390,617 L425,617" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><text x="40" y="760" font-size="18">현재 상태 요약 → 필요한 경우 결과물·근거로 내려가기</text><text x="40" y="810" font-size="18">덜 보여 주는 것과 검증 근거를 없애는 것은 다르다.</text><text x="40" y="855" font-size="18">오른쪽 질문과 정보 층위는 발표를 읽고 구성한 독자적 해석.</text></g></svg>