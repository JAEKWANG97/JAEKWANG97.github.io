<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Diogo: 의미 판단과 행동 규칙을 나눈다</title><desc id="desc">현재 Choice 문서에 착안한 별도 예시. 발표의 운영 실적이 아니다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Diogo: 의미 판단과 행동 규칙을 나눈다</text><text x="35" y="84" font-size="17">현재 Choice 문서에 착안한 별도 예시. 발표의 운영 실적이 아니다.</text><rect x="100" y="125" width="620" height="110" rx="13" fill="#dfece5"/><text x="118" y="159" font-size="21" font-weight="700">고객 지원 입력</text><text x="118" y="189" font-size="18" font-weight="400">상품 문제와 청구 문제 · 원하는 해결은 불명확</text><path d="M300,235 L205,290" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M520,235 L615,290" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="300" width="350" height="140" rx="13" fill="#dfece5"/><text x="58" y="334" font-size="21" font-weight="700">질문 1: 담당 부서?</text><text x="58" y="364" font-size="18" font-weight="400">선택지와 판단 기준을 명시</text><text x="58" y="394" font-size="18" font-weight="400">부서 분류 결과</text><rect x="430" y="300" width="350" height="140" rx="13" fill="#ede2cb"/><text x="448" y="334" font-size="21" font-weight="700">질문 2: 원하는 해결?</text><text x="448" y="364" font-size="18" font-weight="400">교환 · 환불 등 의도는 별도</text><text x="448" y="394" font-size="18" font-weight="400">불확실할 수 있는 결과</text><path d="M205,440 L330,495" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M615,440 L490,495" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="140" y="505" width="540" height="110" rx="13" fill="#dfece5"/><text x="158" y="539" font-size="21" font-weight="700">앱 코드가 처리 규칙을 결정</text><text x="158" y="569" font-size="18" font-weight="400">분류는 활용하되 모호한 의도는 확정하지 않기</text><path d="M300,615 L205,665" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M520,615 L615,665" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="675" width="350" height="100" rx="13" fill="#dfece5"/><text x="58" y="709" font-size="21" font-weight="700">처리 가능한 부분</text><text x="58" y="739" font-size="18" font-weight="400">적절한 지원 경로로 분류</text><rect x="430" y="675" width="350" height="100" rx="13" fill="#ede2cb"/><text x="448" y="709" font-size="21" font-weight="700">추가 확인할 부분</text><text x="448" y="739" font-size="18" font-weight="400">원하는 해결을 확인한 뒤 처리</text><text x="40" y="827" font-size="18">구조화된 응답 ≠ 정확성 보장 ≠ 실행 허가</text><text x="40" y="862" font-size="18">분기 경로는 설명용 재구성이며 공식 API 코드가 아니다.</text></g></svg>