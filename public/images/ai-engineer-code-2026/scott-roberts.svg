<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img"><title>빠른 판단을 넣되 실행과 실패의 경계는 남긴다</title><rect width="1200" height="820" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" fill="#183c37"><text x="60" y="62" font-size="30" font-weight="700">빠른 판단을 넣되 실행과 실패의 경계는 남긴다</text><text x="60" y="103" font-size="19">Scott Roberts · 발표와 추가 자료의 관계를 정리한 자체 해설</text><rect x="60" y="140" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="175" font-size="19" font-weight="700">발표 · 화면</text><text x="85" y="219" font-size="25">입력 중 의도 → 업무 카드</text><text x="585" y="219" font-size="25">카드 선택 → 세부 정보 채우기</text><rect x="60" y="300" width="1080" height="124" rx="16" fill="#e7e7db"/><text x="85" y="335" font-size="19" font-weight="700">해설 · 실행 경계</text><text x="85" y="379" font-size="25">예측한 값과 추천 화면</text><text x="585" y="379" font-size="25">실행 허락과 업무 규칙은 별도</text><rect x="60" y="460" width="1080" height="124" rx="16" fill="#ede2cb"/><text x="85" y="495" font-size="19" font-weight="700">발표 · 데이터</text><text x="85" y="539" font-size="25">SQL 함수 → 의미 판단</text><text x="585" y="539" font-size="25">합성 데이터 실험 ≠ 운영 검증</text><rect x="60" y="620" width="1080" height="124" rx="16" fill="#dfece5"/><text x="85" y="655" font-size="19" font-weight="700">해설 · 실패 경계</text><text x="85" y="699" font-size="25">호출 실패 / 미판정</text><text x="585" y="699" font-size="25">조건 불일치와 구분해 기록</text></g></svg>