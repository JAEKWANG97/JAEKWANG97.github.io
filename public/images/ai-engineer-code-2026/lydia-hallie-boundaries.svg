<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#617782}.head{font-size:25px;font-weight:700}.body{font-size:21px}</style><text x="50" y="66" class="title">사람이 빠진 자리에 필요한 세 가지 질문</text><text x="50" y="108" class="sub">발표의 문제의식을 바탕으로 재구성한 설명용 도식</text><rect x="50" y="160" width="350" height="330" rx="16" fill="white" stroke="#147d83" stroke-width="2"/><rect x="50" y="160" width="350" height="8" fill="#147d83"/><text x="74" y="214" class="head">행동 전 판단</text><text x="74" y="270" class="body">이 행동을 허용했는가?</text><text x="74" y="312" class="body">요청의 범위 확인</text><text x="74" y="354" class="body">대상과 외부 효과 확인</text><text x="74" y="396" class="body">명령 허용 ≠ 실행 중 격리</text><rect x="425" y="160" width="350" height="330" rx="16" fill="white" stroke="#c57831" stroke-width="2"/><rect x="425" y="160" width="350" height="8" fill="#c57831"/><text x="449" y="214" class="head">실행 중 경계</text><text x="449" y="270" class="body">어디까지 접근 가능한가?</text><text x="449" y="312" class="body">파일·네트워크 제한</text><text x="449" y="354" class="body">하위 프로세스까지 제한</text><text x="449" y="396" class="body">셸 밖 연동은 별도 확인</text><rect x="800" y="160" width="350" height="330" rx="16" fill="white" stroke="#486aa6" stroke-width="2"/><rect x="800" y="160" width="350" height="8" fill="#486aa6"/><text x="824" y="214" class="head">결과 검증</text><text x="824" y="270" class="body">원하던 결과가 나왔는가?</text><text x="824" y="312" class="body">완료 조건을 검사로 변환</text><text x="824" y="354" class="body">검사 실행 결과 보관</text><text x="824" y="396" class="body">통과 ≠ 요구사항의 완전성</text><line x1="50" y1="532" x2="1150" y2="532" stroke="#ccd6d7"/><text x="50" y="575" class="sub">권한 판단, 실행 범위, 결과 검증은 서로를 대신하지 않는다.</text></svg>