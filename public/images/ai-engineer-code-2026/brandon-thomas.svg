<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="같은 기능 기반, 서로 다른 작업 화면"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">같은 기능 기반, 서로 다른 작업 화면</text><text x="48" y="101" font-size="18">Brandon Thomas 발표에서 영감을 받은 개념도 · 실제 코드 구조 아님</text><rect x="48" y="150" width="275" height="100" rx="14" fill="#d9eae5"/><text x="68" y="188" font-size="23" font-weight="700">역할 A의 화면</text><text x="68" y="224" font-size="19">필요한 기능만 노출</text><rect x="363" y="150" width="275" height="100" rx="14" fill="#d9eae5"/><text x="383" y="188" font-size="23" font-weight="700">역할 B의 화면</text><text x="383" y="224" font-size="19">작업 순서에 맞게 구성</text><rect x="678" y="150" width="275" height="100" rx="14" fill="#d9eae5"/><text x="698" y="188" font-size="23" font-weight="700">자동화 도구</text><text x="698" y="224" font-size="19">반복 작업을 호출</text><path d="M185 255V310" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M500 255V310" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M815 255V310" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="325" width="904" height="100" rx="14" fill="#badbd0"/><text x="68" y="363" font-size="23" font-weight="700">공통 기능과 데이터 처리</text><text x="68" y="399" font-size="19">여러 화면이 같은 동작과 형식을 공유</text><path d="M500 430V465" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="480" width="904" height="100" rx="14" fill="#eadfcf"/><text x="68" y="518" font-size="23" font-weight="700">변경의 경계</text><text x="68" y="554" font-size="19">화면 변경과 API·파일 형식 변경의 영향을 구분</text><text x="48" y="620" font-size="20">수정 가능성은 기회이고, 호환성 검증은 남는 책임이다.</text></g></svg>