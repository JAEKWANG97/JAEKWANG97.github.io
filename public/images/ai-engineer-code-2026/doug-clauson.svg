<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="리뷰 의견을 근거 있는 판정으로 바꾸기"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="24" fill="#f5f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#173d35"><text x="48" y="62" font-size="30" font-weight="700">리뷰 의견을 근거 있는 판정으로 바꾸기</text><text x="48" y="101" font-size="18">Doug Clauson 발표와 팀 운영 기록을 바탕으로 한 필자의 재구성</text><rect x="48" y="150" width="270" height="100" rx="14" fill="#d9eae5"/><text x="68" y="188" font-size="23" font-weight="700">빠른 검사</text><text x="68" y="224" font-size="19">빌드·기본 테스트</text><rect x="365" y="150" width="270" height="100" rx="14" fill="#d9eae5"/><text x="385" y="188" font-size="23" font-weight="700">역할별 리뷰</text><text x="385" y="224" font-size="19">코드·설계·사용 경험</text><rect x="682" y="150" width="270" height="100" rx="14" fill="#d9eae5"/><text x="702" y="188" font-size="23" font-weight="700">근거 확인</text><text x="702" y="224" font-size="19">위치·조건·결과</text><path d="M320 200H352" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M638 200H670" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M820 255V307H280V345" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><path d="M820 307V345" fill="none" stroke="#527069" stroke-width="2.5" marker-end="url(#a)"/><rect x="48" y="360" width="430" height="120" rx="14" fill="#f1d3b5"/><text x="68" y="398" font-size="23" font-weight="700">실제 결함·중대한 위험</text><text x="68" y="434" font-size="19">현재 변경에서 해결 또는 추가 검토</text><rect x="522" y="360" width="430" height="120" rx="14" fill="#e1e8e0"/><text x="542" y="398" font-size="23" font-weight="700">사소한 개선 제안</text><text x="542" y="434" font-size="19">범위를 분리해 후속 작업으로</text><text x="48" y="550" font-size="22">공통 기록: 검사한 버전 · 발견 · 처리 근거 · 최종 판정</text><text x="48" y="592" font-size="20">검사 대상이 자기 판정 규칙을 임의로 바꾸지 못하게 한다.</text></g></svg>