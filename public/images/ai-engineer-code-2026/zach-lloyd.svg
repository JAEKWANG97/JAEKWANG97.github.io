<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">운영 관찰과 고정 과제 비교를 연결하는 개선 루프</title>
<desc id="desc">운영에서 실패 사례와 근거를 모아 변경 후보를 만든다. 같은 출발 상태와 과제에 기준 설정과 후보 설정을 각각 실행하고 성공 기준, 비용, 시간을 비교한다. 결과에 따라 채택하거나 보류하고 운영에서 다시 관찰한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#47735f"/></marker></defs>
<rect width="1200" height="950" rx="20" fill="#f7f5ef"/>
<g font-family="Arial, 'Noto Sans CJK KR', sans-serif" fill="#183c30">
<text x="55" y="62" font-size="30" font-weight="700">어디를 바꿀지 찾는 일과, 개선됐는지 확인하는 일</text>
<text x="55" y="100" font-size="19" fill="#52665a">Zach Lloyd · 발표와 별도 1차 자료를 연결한 자체 해설 도식</text>
<rect x="45" y="130" width="1110" height="235" rx="15" fill="#e9efe8"/>
<text x="70" y="170" font-size="21" font-weight="700">A. 운영에서 관찰하기</text>
<g fill="white" stroke="#8aa08e" stroke-width="2"><rect x="75" y="210" width="290" height="110" rx="12"/><rect x="455" y="210" width="290" height="110" rx="12"/><rect x="835" y="210" width="290" height="110" rx="12"/></g>
<g text-anchor="middle"><text x="220" y="250" font-size="22" font-weight="700">실행 기록과 결과</text><text x="220" y="286" font-size="18">어떤 설정에서 무엇이 일어났나</text><text x="600" y="250" font-size="22" font-weight="700">특정 실패 평가</text><text x="600" y="286" font-size="18">예: 불필요한 테스트의 반복</text><text x="980" y="250" font-size="22" font-weight="700">변경 후보</text><text x="980" y="286" font-size="18">스킬·모델·작업 방식 수정</text></g>
<g fill="none" stroke="#47735f" stroke-width="2.5" marker-end="url(#arrow)"><path d="M365 265H450"/><path d="M745 265H830"/></g>
<rect x="45" y="415" width="1110" height="445" rx="15" fill="#f0ece2"/>
<path d="M980 320V388H600V475" fill="none" stroke="#47735f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="70" y="455" font-size="21" font-weight="700">B. 같은 조건에서 비교하기</text>
<rect x="380" y="480" width="440" height="65" rx="12" fill="white" stroke="#a79a7e" stroke-width="2"/>
<text x="600" y="520" text-anchor="middle" font-size="21" font-weight="700">동일한 과제·출발 상태·성공 기준</text>
<g fill="white" stroke="#a79a7e" stroke-width="2"><rect x="190" y="590" width="320" height="95" rx="12"/><rect x="690" y="590" width="320" height="95" rx="12"/><rect x="380" y="740" width="440" height="75" rx="12"/></g>
<g text-anchor="middle"><text x="350" y="628" font-size="22" font-weight="700">기준 설정 실행</text><text x="350" y="660" font-size="18">현재 방식</text><text x="850" y="628" font-size="22" font-weight="700">후보 설정 실행</text><text x="850" y="660" font-size="18">비교하려는 변경만 적용</text><text x="600" y="770" font-size="21" font-weight="700">성공 여부·비용·시간 비교</text><text x="600" y="798" font-size="17">실패·막힘도 결과에 남긴다</text></g>
<g fill="none" stroke="#47735f" stroke-width="2.5" marker-end="url(#arrow)"><path d="M490 545V565H350V585"/><path d="M710 545V565H850V585"/><path d="M350 685V715H490V735"/><path d="M850 685V715H710V735"/><path d="M820 780H1140V190H220V205"/></g>
<rect x="925" y="700" width="190" height="65" rx="10" fill="#f0ece2"/>
<text x="1020" y="724" text-anchor="middle" font-size="16">채택 또는 보류</text><text x="1020" y="750" text-anchor="middle" font-size="16">운영 결과 재확인</text>
<text x="55" y="900" font-size="18" fill="#52665a">평가 점수는 개선의 단서다. 설정 변경의 이익과 운영 안전성을 별도로 확인한다.</text>
</g></svg>
