<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Simon: 출력을 현실에 다시 연결하기</title><desc id="desc">본인이 공개한 두 제작 경험을 비교한 설명도. 독립 성능 검증 아님.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Simon: 출력을 현실에 다시 연결하기</text><text x="35" y="84" font-size="17">본인이 공개한 두 제작 경험을 비교한 설명도. 독립 성능 검증 아님.</text><rect x="40" y="135" width="350" height="115" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">Beep Locator</text><text x="58" y="199" font-size="18" font-weight="400">실제 소리가 나는 위치 찾기</text><rect x="430" y="135" width="350" height="115" rx="13" fill="#dfece5"/><text x="448" y="169" font-size="21" font-weight="700">게임 제작</text><text x="448" y="199" font-size="18" font-weight="400">작동하는 게임을 재미있게 만들기</text><path d="M215,250 L215,305" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M605,250 L605,305" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="315" width="350" height="170" rx="13" fill="#dfece5"/><text x="58" y="349" font-size="21" font-weight="700">관측과 가정 수정</text><text x="58" y="379" font-size="18" font-weight="400">여러 기기의 소리 수집</text><text x="58" y="409" font-size="18" font-weight="400">대략적 위치를 사람이 지정</text><text x="58" y="439" font-size="18" font-weight="400">손뼉 테스트 · 녹음 재청취</text><rect x="430" y="315" width="350" height="170" rx="13" fill="#dfece5"/><text x="448" y="349" font-size="21" font-weight="700">경험과 규칙 수정</text><text x="448" y="379" font-size="18" font-weight="400">게임 실행 · 플레이 테스트</text><text x="448" y="409" font-size="18" font-weight="400">진행 불가능한 퀘스트 수정</text><text x="448" y="439" font-size="18" font-weight="400">전투와 목표를 조정</text><path d="M215,485 L215,540" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><path d="M605,485 L605,540" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="550" width="350" height="130" rx="13" fill="#dfece5"/><text x="58" y="584" font-size="21" font-weight="700">확인할 결과</text><text x="58" y="614" font-size="18" font-weight="400">실제 물체를 찾았는가?</text><text x="58" y="644" font-size="18" font-weight="400">약40cm는 본인의 보고값</text><rect x="430" y="550" width="350" height="130" rx="13" fill="#dfece5"/><text x="448" y="584" font-size="21" font-weight="700">확인할 결과</text><text x="448" y="614" font-size="18" font-weight="400">다시 플레이하고 싶은가?</text><text x="448" y="644" font-size="18" font-weight="400">재미는 본인의 체험 평가</text><text x="40" y="750" font-size="18">관측·플레이 → 수정 → 다시 확인: 코드 생성만으로 끝나지 않음</text><text x="40" y="805" font-size="18">구현이 쉬워져 프로젝트가 늘어도 총부담이 줄지는 않을 수 있다.</text><text x="40" y="850" font-size="18">발표와 별도 제작 기록에 착안한 재구성. 보편 성능표가 아니다.</text></g></svg>