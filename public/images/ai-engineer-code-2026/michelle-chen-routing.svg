<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#617782}.head{font-size:25px;font-weight:700}.body{font-size:21px}</style><text x="50" y="66" class="title">값을 읽는 일, 선택하는 일, 새로 풀어내는 일을 나눈다</text><text x="50" y="108" class="sub">발표의 분업 구상을 재구성한 설명용 도식</text><rect x="50" y="160" width="350" height="330" rx="16" fill="white" stroke="#147d83" stroke-width="2"/><rect x="50" y="160" width="350" height="8" fill="#147d83"/><text x="74" y="214" class="head">추출 · Clairic</text><text x="74" y="270" class="body">어떤 값이 있는가?</text><text x="74" y="312" class="body">타입과 원문 근거</text><text x="74" y="354" class="body">없음·불확실성의 표현</text><text x="74" y="396" class="body">추출과 추정도 구분</text><rect x="425" y="160" width="350" height="330" rx="16" fill="white" stroke="#c57831" stroke-width="2"/><rect x="425" y="160" width="350" height="8" fill="#c57831"/><text x="449" y="214" class="head">선택 · Clef</text><text x="449" y="270" class="body">어느 선택지가 적합한가?</text><text x="449" y="312" class="body">허용된 답과 확률</text><text x="449" y="354" class="body">후속 경로 결정</text><text x="449" y="396" class="body">빠른 선택도 틀릴 수 있음</text><rect x="800" y="160" width="350" height="330" rx="16" fill="white" stroke="#486aa6" stroke-width="2"/><rect x="800" y="160" width="350" height="8" fill="#486aa6"/><text x="824" y="214" class="head">개방형 작업 · LLM</text><text x="824" y="270" class="body">어떻게 해결할 것인가?</text><text x="824" y="312" class="body">남은 추론과 생성</text><text x="824" y="354" class="body">필요한 실제 행동 수행</text><text x="824" y="396" class="body">권한과 결과는 별도 검증</text><line x1="50" y1="532" x2="1150" y2="532" stroke="#ccd6d7"/><text x="50" y="575" class="sub">유효한 형식 ≠ 정확한 내용 · 전체 작업의 성공률과 비용을 함께 비교한다.</text></svg>