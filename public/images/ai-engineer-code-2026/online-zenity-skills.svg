<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="t d"><title id="t">스킬의 문서와 실행 사이를 관찰하기</title><desc id="d">아무 일도 없었다는 결과보다, 어디까지 시험했는지가 먼저다. 진입 문서: SKILL.md가 설명하는 목적과 권한. 불러오는 대상: 추가 지침 · 패키지 · 스크립트 · 원격 자료. 도달한 실행 경로: 환경 준비 → 실제 과제 수행 → 분기와 중단 확인. 실제 효과: 도구 호출뿐 아니라 프로세스 · 파일 · 네트워크 관찰</desc><rect width="760" height="750" rx="24" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#203638"><text x="40" y="55" font-size="28" font-weight="700">스킬의 문서와 실행 사이를 관찰하기</text><text x="40" y="91" font-size="18">아무 일도 없었다는 결과보다, 어디까지 시험했는지가 먼저다.</text><rect x="35" y="125" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="165" font-size="24" font-weight="700">진입 문서</text><text x="58" y="204" font-size="19">SKILL.md가 설명하는 목적과 권한</text><rect x="35" y="260" width="690" height="110" rx="16" fill="#e5e8f1"/><text x="58" y="300" font-size="24" font-weight="700">불러오는 대상</text><text x="58" y="339" font-size="19">추가 지침 · 패키지 · 스크립트 · 원격 자료</text><rect x="35" y="395" width="690" height="110" rx="16" fill="#eee4df"/><text x="58" y="435" font-size="24" font-weight="700">도달한 실행 경로</text><text x="58" y="474" font-size="19">환경 준비 → 실제 과제 수행 → 분기와 중단 확인</text><rect x="35" y="530" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="570" font-size="24" font-weight="700">실제 효과</text><text x="58" y="609" font-size="19">도구 호출뿐 아니라 프로세스 · 파일 · 네트워크 관찰</text><text x="40" y="709" font-size="18">스캔 통과나 조용한 실행 한 번이 전체 안전을 보장하지 않는다.</text><text x="40" y="737" font-size="16">발표에서 착안한 독자적 설명 도식. 원본 슬라이드가 아니다.</text></g></svg>