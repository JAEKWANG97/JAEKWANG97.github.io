<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>도구 왕복과 코드 내부 처리를 구분하는 개념도</title><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.t{font-size:31px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:21px}.s{font-size:19px;fill:#617782}</style><text x="50" y="65" class="t">기능을 없애는 대신, 중간 처리를 실행 환경으로 옮긴다</text><text x="50" y="108" class="s">호출 방식의 개념 비교 · 성능 수치가 아닌 자체 설명도</text><rect x="50" y="155" width="1100" height="150" rx="14" fill="white" stroke="#c57831" stroke-width="2"/><text x="75" y="200" class="h">개별 도구 호출의 예</text><text x="75" y="255" class="b">모델 → 조회 → 모델 → 필터 도구 → 모델 → 후속 도구 → 모델</text><rect x="50" y="335" width="1100" height="150" rx="14" fill="white" stroke="#147d83" stroke-width="2"/><text x="75" y="380" class="h">코드로 묶은 실행</text><text x="75" y="435" class="b">모델 → [ 조회 → 필터 → 후속 도구 ] → 필요한 결과 → 모델</text><text x="50" y="550" class="s">실제 행동과 권한은 그대로 존재한다. 각 행동의 실패와 외부 효과도 추적해야 한다.</text><text x="50" y="590" class="s">무엇을 코드가 처리하고, 무엇을 모델이 판단해야 하는지가 설계의 경계다.</text></svg>