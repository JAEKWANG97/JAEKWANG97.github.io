<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>추론 상태의 이상 신호를 언제 사용할 것인가</title><desc>탐지 신호와 정책 결정은 별도 단계 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">추론 상태의 이상 신호를 언제 사용할 것인가</text><text x="45" y="90" font-size="17" fill="#52647b">탐지 신호와 정책 결정은 별도 단계 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">실행 중 관측</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">추론 엔진</text><text x="63.0" y="220" font-size="16" fill="#52647b">관련 KV 페이지 생성</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">이상 신호</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">기준선과 비교</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">행동 전 정책 판단</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">지연 내 도착해야 예방 가능</text><text x="45" y="305" font-size="18" font-weight="700">저장 후 관측</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">보관된 캐시</text><text x="63.0" y="380" font-size="16" fill="#52647b">완료된 요청도 포함</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">조사 우선순위</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">의심 구간을 좁힘</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">사후 분석</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">실제 위반인지 확인</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">상위 경보의 유용성 ≠ 전체 공격 재현율. 원문 미열람 ≠ 민감정보 위험 없음.</text></g></svg>