<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>명세가 일관된 것과 의도에 맞는 것은 다르다</title><desc>필자의 검토 절차 · 제품 내부 구현도가 아님</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">명세가 일관된 것과 의도에 맞는 것은 다르다</text><text x="45" y="90" font-size="17" fill="#52647b">필자의 검토 절차 · 제품 내부 구현도가 아님</text><text x="45" y="145" font-size="18" font-weight="700">논리 검사</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">자연어 요구</text><text x="63.0" y="220" font-size="16" fill="#52647b">정책·용어·조건</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">형식 해석</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">여러 해석의 차이 확인</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">관계 검사</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">동시 충족 가능한가?</text><text x="45" y="305" font-size="18" font-weight="700">의미 확인</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">구체적 사례</text><text x="63.0" y="380" font-size="16" fill="#52647b">경계·실패·동시 요청</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">업무 담당자 결정</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">선택의 책임과 근거</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">명세 + 테스트</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">같은 결정을 유지</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">논리적으로 가능한 해석도 의도와 다를 수 있다. 질문과 보류를 정상적인 결과로 둔다.</text></g></svg>