<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>업무를 정리하는 것과 권한을 넓히는 것은 다른 일이다</title><desc>온콜 동료를 평가하는 두 축 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">업무를 정리하는 것과 권한을 넓히는 것은 다른 일이다</text><text x="45" y="90" font-size="17" fill="#52647b">온콜 동료를 평가하는 두 축 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">업무 상태 · 서로 다른 분류이며 진행 순서가 아님</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">처리 완료</text><text x="63.0" y="220" font-size="16" fill="#52647b">결과 확인·기록</text><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">진행 중</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">담당·상태·중단 감시</text><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">결정 필요</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">근거·영향·선택지를 전달</text><text x="45" y="305" font-size="18" font-weight="700">행동별 권한</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">조사와 제안</text><text x="63.0" y="380" font-size="16" fill="#52647b">범위 안에서 근거 수집</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">승인 후 실행</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">구체적 조치를 승인</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">제한된 자율 실행</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">해당 행동의 이력·위험 평가</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">자동화도 교대·점검·폐기의 대상이다. 특정 행동의 성공이 모든 운영 권한을 정당화하지 않는다.</text></g></svg>