<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>의심에서 공동 검증으로 이어지는 협업</title><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#617782}.head{font-size:25px;font-weight:700}.body{font-size:21px}</style><text x="50" y="66" class="title">신뢰는 결론을 받는 데서, 근거를 함께 보는 쪽으로</text><text x="50" y="108" class="sub">Inspect 사례의 협업 흐름을 재구성한 설명용 도식</text><rect x="50" y="160" width="350" height="330" rx="16" fill="white" stroke="#147d83" stroke-width="2"/><rect x="50" y="160" width="350" height="8" fill="#147d83"/><text x="74" y="214" class="head">문제와 첫 가설</text><text x="74" y="270" class="body">문제 신고자가 참여</text><text x="74" y="312" class="body">에이전트가 원인 후보 제시</text><text x="74" y="354" class="body">동료가 의문을 제기</text><text x="74" y="396" class="body">첫 답을 결론으로 삼지 않음</text><rect x="425" y="160" width="350" height="330" rx="16" fill="white" stroke="#c57831" stroke-width="2"/><rect x="425" y="160" width="350" height="8" fill="#c57831"/><text x="449" y="214" class="head">공동 조사와 검증</text><text x="449" y="270" class="body">추가 조사 방향을 함께 결정</text><text x="449" y="312" class="body">구체적 동작과 근거 확인</text><text x="449" y="354" class="body">수정 결과를 관찰</text><text x="449" y="396" class="body">실행 자료를 같은 맥락에 보관</text><rect x="800" y="160" width="350" height="330" rx="16" fill="white" stroke="#486aa6" stroke-width="2"/><rect x="800" y="160" width="350" height="8" fill="#486aa6"/><text x="824" y="214" class="head">재사용되는 경험</text><text x="824" y="270" class="body">다른 동료도 과정 확인</text><text x="824" y="312" class="body">반복 방법을 도구로 전환</text><text x="824" y="354" class="body">공통 기반에 개선 반영</text><text x="824" y="396" class="body">공유 범위는 별도 관리</text><line x1="50" y1="532" x2="1150" y2="532" stroke="#ccd6d7"/><text x="50" y="575" class="sub">공개 범위를 넓히는 것 자체가 목적은 아니다. 확인 가능한 근거와 참여 경로가 핵심이다.</text><path d="M403 325H422M415 318L422 325L415 332M778 325H797M790 318L797 325L790 332" fill="none" stroke="#617782" stroke-width="2"/></svg>