<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" role="img" aria-labelledby="title desc"><title id="title">Ayush: 반복 우회 코드를 제품 요구로 읽기</title><desc id="desc">단발성 파이프를 없애자는 것이 아니라 반복되는 마찰을 찾는다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3c6864"/></marker></defs><rect width="820" height="900" fill="#f6f4ee"/><g font-family="Noto Sans CJK KR,sans-serif" fill="#183c37"><text x="35" y="48" font-size="27" font-weight="700">Ayush: 반복 우회 코드를 제품 요구로 읽기</text><text x="35" y="84" font-size="17">단발성 파이프를 없애자는 것이 아니라 반복되는 마찰을 찾는다.</text><rect x="40" y="135" width="350" height="135" rx="13" fill="#dfece5"/><text x="58" y="169" font-size="21" font-weight="700">전체 세션 뒤 grep·head</text><text x="58" y="199" font-size="18" font-weight="400">필요한 구간만 따로 추출</text><rect x="430" y="135" width="350" height="135" rx="13" fill="#dfece5"/><text x="448" y="169" font-size="21" font-weight="700">도구의 선택 기능</text><text x="448" y="199" font-size="18" font-weight="400">일치한 메시지와 주변 문맥</text><path d="M390,202 L425,202" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="330" width="350" height="135" rx="13" fill="#dfece5"/><text x="58" y="364" font-size="21" font-weight="700">JSON 뒤 Python</text><text x="58" y="394" font-size="18" font-weight="400">필요한 필드만 다시 추출</text><rect x="430" y="330" width="350" height="135" rx="13" fill="#dfece5"/><text x="448" y="364" font-size="21" font-weight="700">도구의 출력 기능</text><text x="448" y="394" font-size="18" font-weight="400">필드 선택 · 간결한 형식</text><path d="M390,397 L425,397" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="525" width="350" height="135" rx="13" fill="#dfece5"/><text x="58" y="559" font-size="21" font-weight="700">여러 세션에 같은 호출</text><text x="58" y="589" font-size="18" font-weight="400">같은 명령을 반복 실행</text><rect x="430" y="525" width="350" height="135" rx="13" fill="#dfece5"/><text x="448" y="559" font-size="21" font-weight="700">도구의 조회 기능</text><text x="448" y="589" font-size="18" font-weight="400">여러 대상을 한 번에 요청</text><path d="M390,592 L425,592" fill="none" stroke="#3c6864" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="710" width="740" height="100" rx="13" fill="#ede2cb"/><text x="58" y="744" font-size="21" font-weight="700">변경 뒤 확인할 두 가지</text><text x="58" y="774" font-size="18" font-weight="400">스킬·도움말이 새 기능을 안내하는가? / 실패 정보가 남는가?</text><text x="40" y="860" font-size="18">자체 설명도. 출력량보다 실제 답의 정확성과 다음 행동을 평가.</text></g></svg>