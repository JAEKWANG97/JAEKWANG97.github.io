<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img"><title>검사 목록에 없다는 것과 의존성이 없다는 것은 다르다</title><desc>데이터 변경 리뷰의 두 관측 경로 · 필자 해설</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52647b" stroke-width="1.4"/></marker></defs><rect width="1200" height="100%" fill="#f4f7fb"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#15283e"><text x="45" y="55" font-size="28" font-weight="700">검사 목록에 없다는 것과 의존성이 없다는 것은 다르다</text><text x="45" y="90" font-size="17" fill="#52647b">데이터 변경 리뷰의 두 관측 경로 · 필자 해설</text><text x="45" y="145" font-size="18" font-weight="700">확정된 규칙을 검사</text><rect x="45.0" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="192" font-size="21" font-weight="700">스키마 변경</text><text x="63.0" y="220" font-size="16" fill="#52647b">생산자 허용 범위 변경</text><path d="M391.6666666666667 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="192" font-size="21" font-weight="700">등록된 검사</text><text x="447.6666666666667" y="220" font-size="16" fill="#52647b">소유권·계보·정책</text><path d="M776.3333333333334 213h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="161" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="192" font-size="21" font-weight="700">검사 범위 내 결과</text><text x="832.3333333333334" y="220" font-size="16" fill="#52647b">통과 범위를 명시</text><text x="45" y="305" font-size="18" font-weight="700">등록 밖의 관계를 조사</text><rect x="45.0" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="63.0" y="352" font-size="21" font-weight="700">저장소 탐색</text><text x="63.0" y="380" font-size="16" fill="#52647b">소비 코드·저장 대상</text><path d="M391.6666666666667 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="429.6666666666667" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="447.6666666666667" y="352" font-size="21" font-weight="700">사람이 운영 상태 확인</text><text x="447.6666666666667" y="380" font-size="16" fill="#52647b">현재 사용하는 경로인가?</text><path d="M776.3333333333334 373h30" stroke="#52647b" stroke-width="2" marker-end="url(#a)"/><rect x="814.3333333333334" y="321" width="340.6666666666667" height="105" rx="12" fill="white" stroke="#b8cada" stroke-width="2"/><text x="832.3333333333334" y="352" font-size="21" font-weight="700">변경 순서 결정</text><text x="832.3333333333334" y="380" font-size="16" fill="#52647b">소비자 준비 → 생산자 변경</text><rect x="45" y="490" width="1110" height="54" rx="10" fill="#17344f"/><text x="65" y="524" font-size="18" fill="white">에이전트가 찾은 후보는 근거다. 실제 사용 여부와 안전한 전환 순서는 별도로 확인한다.</text></g></svg>