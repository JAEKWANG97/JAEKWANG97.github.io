<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050" role="img"><title>코드 작성 이후의 후속 실행과 사람의 결정</title><desc>알림에서 수정과 실제 스택 검증, PR 근거, CI 재시도, 사람 승인과 병합으로 이어지는 설명용 개념도</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#527069" stroke-width="1.5"/></marker></defs><rect width="1100" height="1050" rx="20" fill="#f6f5f0"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#173d35"><text x="45" y="57" font-size="30" font-weight="700">패치를 만드는 단계와 검토할 결과를 만드는 단계</text><text x="45" y="94" font-size="19">Joey Wang 발표를 읽기 위한 필자의 개념도 · 실제 서비스 구성도 아님</text><rect x="55" y="140" width="610" height="100" rx="15" fill="#e0eeea"/><text x="77" y="177" font-size="24" font-weight="700">1. 알림에서 수정 작업으로</text><text x="77" y="213" font-size="19">야간 이벤트를 받아 실행을 시작</text><rect x="55" y="285" width="610" height="110" rx="15" fill="#e0eeea"/><text x="77" y="322" font-size="24" font-weight="700">2. 실제 스택으로 확인</text><text x="77" y="358" font-size="19">실행 환경에서 동작 확인 · PR에 근거 연결</text><rect x="55" y="440" width="610" height="110" rx="15" fill="#e0eeea"/><text x="77" y="477" font-size="24" font-weight="700">3. CI 결과를 다음 행동에 사용</text><text x="77" y="513" font-size="19">실패를 읽고 수정 · 성공은 검토의 근거</text><rect x="55" y="605" width="610" height="110" rx="15" fill="#f0e3cd"/><text x="77" y="642" font-size="24" font-weight="700">4. 사람의 검토와 승인</text><text x="77" y="678" font-size="19">검증 결과와 남은 불확실성을 보고 결정</text><rect x="55" y="770" width="610" height="110" rx="15" fill="#e0eeea"/><text x="77" y="807" font-size="24" font-weight="700">5. 승인된 변경을 병합</text><text x="77" y="843" font-size="19">패치 생성·검사 통과와 승인 여부는 별개</text><path d="M360 240 V277" fill="none" stroke="#527069" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 395 V432" fill="none" stroke="#527069" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 550 V597" fill="none" stroke="#527069" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 715 V762" fill="none" stroke="#527069" stroke-width="3" marker-end="url(#arrow)"/><path d="M55 490 H25 V190 H50" fill="none" stroke="#527069" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="580" font-size="17">실패 시 후속 수정은 반복하되, 판단 필요 상태와 구분</text><rect x="715" y="285" width="330" height="170" rx="15" fill="#e5e9f4"/><text x="737" y="322" font-size="24" font-weight="700">Dot의 별도 역할</text><text x="737" y="358" font-size="19">질문 모으기</text><text x="737" y="387" font-size="19">답변 초안 준비</text><text x="737" y="416" font-size="19">사람 승인 후 전달</text><path d="M715 385 H690 V660 H670" fill="none" stroke="#527069" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="715" y="515" font-size="20" font-weight="700">질문을 정리하는 것 ≠</text><text x="715" y="547" font-size="20" font-weight="700">답을 독단적으로 확정하기</text><text x="55" y="935" font-size="23" font-weight="700">원문 사례와 해설의 경계</text><text x="55" y="974" font-size="20">화살표는 논리적 관계다. 모든 PR이 이 검증을 갖춘다는 뜻은 아니다.</text></g></svg>