<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#f8f8f3"/><style>text{font-family:'Noto Sans CJK KR',sans-serif;fill:#213e47}.t{font-size:31px;font-weight:700}.h{font-size:24px;font-weight:700}.b{font-size:21px}.s{font-size:19px;fill:#617782}</style><text x="50" y="65" class="t">분류 체계를 만드는 일과, 새 메일을 분류하는 일</text><text x="50" y="108" class="s">UiPath 발표의 이메일 사례를 재구성한 설명용 도식</text><rect x="50" y="160" width="1100" height="155" rx="14" fill="white" stroke="#147d83" stroke-width="2"/><text x="75" y="205" class="h">설계 · 개선 단계</text><text x="75" y="265" class="b">범주 제안 → 대량 분류 → 분포와 사례 검토 → 범주 수정</text><rect x="50" y="345" width="1100" height="155" rx="14" fill="white" stroke="#486aa6" stroke-width="2"/><text x="75" y="390" class="h">반복 실행 단계</text><text x="75" y="450" class="b">새 메일 → 정해진 범주로 판단 → 담당 경로로 전달 / 애매하면 보류</text><text x="50" y="560" class="s">보류 경로는 자체 적용 제안. 실제 운영 결과는 다음 범주 검토의 입력이 된다.</text><text x="50" y="598" class="s">범주를 매번 새로 만들 필요는 없지만, 영구히 고정할 이유도 없다.</text></svg>