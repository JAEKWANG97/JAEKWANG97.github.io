<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 750" role="img" aria-labelledby="t d"><title id="t">스킬 유무로 나누는 네 가지 관찰</title><desc id="d">질문 단위의 결과다. 실제 과제 수행은 다시 평가해야 한다. 둘 다 정답: 이 질문에 답할 수 있다 → 삭제 여부는 별도 검증. 스킬이 있을 때만 정답: 답변 개선 신호 → 어떤 조건에서 도움이 되는지 확인. 스킬이 없을 때만 정답: 혼동이나 충돌의 신호 → 우선 원인 조사. 둘 다 오답: 표현 · 질문 · 기대 답 · 필요한 도구를 함께 재검토</desc><rect width="760" height="750" rx="24" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#203638"><text x="40" y="55" font-size="28" font-weight="700">스킬 유무로 나누는 네 가지 관찰</text><text x="40" y="91" font-size="18">질문 단위의 결과다. 실제 과제 수행은 다시 평가해야 한다.</text><rect x="35" y="125" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="165" font-size="24" font-weight="700">둘 다 정답</text><text x="58" y="204" font-size="19">이 질문에 답할 수 있다 → 삭제 여부는 별도 검증</text><rect x="35" y="260" width="690" height="110" rx="16" fill="#e5e8f1"/><text x="58" y="300" font-size="24" font-weight="700">스킬이 있을 때만 정답</text><text x="58" y="339" font-size="19">답변 개선 신호 → 어떤 조건에서 도움이 되는지 확인</text><rect x="35" y="395" width="690" height="110" rx="16" fill="#eee4df"/><text x="58" y="435" font-size="24" font-weight="700">스킬이 없을 때만 정답</text><text x="58" y="474" font-size="19">혼동이나 충돌의 신호 → 우선 원인 조사</text><rect x="35" y="530" width="690" height="110" rx="16" fill="#e4eeea"/><text x="58" y="570" font-size="24" font-weight="700">둘 다 오답</text><text x="58" y="609" font-size="19">표현 · 질문 · 기대 답 · 필요한 도구를 함께 재검토</text><text x="40" y="709" font-size="18">후보 편집 → 원래 과제 재평가 → 성능 유지 시 채택</text><text x="40" y="737" font-size="16">발표에서 착안한 독자적 설명 도식. 원본 슬라이드가 아니다.</text></g></svg>