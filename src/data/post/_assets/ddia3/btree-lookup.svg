<svg xmlns="http://www.w3.org/2000/svg" width="480" height="774" viewBox="0 0 480 774" role="img" aria-labelledby="title desc">
<title id="title">B 트리에서 키 50 찾기</title><desc id="desc">루트 구분 키는 40이다. 40 미만의 키는 10, 20, 30을 담은 왼쪽 리프에 있고, 40 이상의 키는 40, 50, 60을 담은 오른쪽 리프에 있다. 키 50은 루트에서 오른쪽 리프로 이동한다. 두 리프는 모바일 가독성을 위해 세로로 배치했다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#64748b"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#1d4ed8"/></marker></defs>
<style>text {font-family:"Noto Sans CJK KR",Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a;font-size:24px} .title{font-size:28px;font-weight:700} .label{font-size:22px;fill:#475569} .strong{font-weight:700} .accent{fill:#1d4ed8;font-weight:700} .muted{fill:#64748b}</style>
<rect width="480" height="774" rx="20" fill="#f8fafc"/>
<text x="24" y="47" class="title" text-anchor="start">B 트리 · 키 50 찾기</text>
<text x="24" y="88" class="label" text-anchor="start">구분 키와 비교해 한 경로만 읽기</text>
<path d="M188 266H44V351H73" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M292 266H436V565H402" fill="none" stroke="#1d4ed8" stroke-width="3"  marker-end="url(#blue)"/>
<text x="56" y="316" class="label" text-anchor="start">&lt; 40</text>
<text x="329" y="316" class="accent" text-anchor="start">50 ≥ 40</text>
<rect x="134" y="141" width="212" height="133" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="240" y="182" class="label" text-anchor="middle">루트 · 구분 키</text>
<text x="240" y="245" class="title" text-anchor="middle">40</text>
<rect x="80" y="338" width="320" height="124" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="104" y="380" class="strong" text-anchor="start">왼쪽 리프 · &lt; 40</text>
<text x="104" y="427" class="muted" text-anchor="start">10     20     30</text>
<rect x="80" y="502" width="320" height="142" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="104" y="544" class="strong" text-anchor="start">오른쪽 리프 · ≥ 40</text>
<rect x="204" y="561" width="70" height="57" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="130" y="601" class="" text-anchor="start">40</text>
<text x="239" y="601" class="accent" text-anchor="middle">50</text>
<text x="312" y="601" class="" text-anchor="start">60</text>
<text x="24" y="704" class="accent" text-anchor="start">루트 → 오른쪽 리프</text>
<text x="24" y="746" class="label" text-anchor="start">두 리프는 세로로 배치한 형제 노드</text>
</svg>