<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1000" viewBox="0 0 480 1000" role="img" aria-labelledby="title desc">
<title id="title">LSM 트리의 쓰기 경로</title><desc id="desc">쓰기는 복구용 WAL에 기록된 뒤 메모리의 memtable에 반영된다. memtable은 불변 정렬 파일인 SSTable로 플러시된다. 컴팩션은 SSTable을 병합하며 안전한 경우에만 옛 버전을 제거한다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#64748b"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#1d4ed8"/></marker></defs>
<style>text {font-family:"Noto Sans CJK KR",Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a;font-size:24px} .title{font-size:28px;font-weight:700} .label{font-size:22px;fill:#475569} .strong{font-weight:700} .accent{fill:#1d4ed8;font-weight:700} .muted{fill:#64748b}</style>
<rect width="480" height="1000" rx="20" fill="#f8fafc"/>
<text x="24" y="47" class="title" text-anchor="start">LSM · 쓰기에서 병합까지</text>
<rect x="24" y="76" width="432" height="76" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="240" y="124" class="strong" text-anchor="middle">쓰기 요청  key = value</text>
<path d="M240 152V190" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/>
<rect x="24" y="204" width="432" height="132" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
<text x="48" y="242" class="strong" text-anchor="start">WAL · 복구용 로그</text>
<text x="48" y="278" class="" text-anchor="start">디스크에 순차 기록</text>
<text x="48" y="314" class="label" text-anchor="start">SSTable과는 다른 파일</text>
<path d="M240 336V390" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="258" y="373" class="label" text-anchor="start">기록 후 반영</text>
<rect x="24" y="404" width="432" height="108" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="48" y="444" class="strong" text-anchor="start">memtable · 메모리</text>
<text x="48" y="482" class="" text-anchor="start">키 순서로 정렬된 데이터</text>
<path d="M240 512V566" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="258" y="549" class="label" text-anchor="start">flush</text>
<rect x="24" y="580" width="432" height="148" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="48" y="620" class="strong" text-anchor="start">SSTable · 디스크</text>
<text x="48" y="658" class="" text-anchor="start">정렬된 불변 파일</text>
<text x="48" y="700" class="accent" text-anchor="start">파일 A  +  파일 B  +  …</text>
<path d="M240 728V782" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="258" y="765" class="label" text-anchor="start">compaction</text>
<rect x="24" y="796" width="432" height="180" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
<text x="48" y="838" class="strong" text-anchor="start">병합 → 새 SSTable</text>
<text x="48" y="883" class="" text-anchor="start">옛 버전은 언제 제거할까?</text>
<text x="48" y="930" class="accent" text-anchor="start">안전할 때만 제거</text>
<text x="48" y="959" class="label" text-anchor="start">진행 중인 읽기 등도 고려</text>
</svg>