<svg xmlns="http://www.w3.org/2000/svg" width="480" height="838" viewBox="0 0 480 838" role="img" aria-labelledby="title desc">
<title id="title">행 저장과 열 저장</title><desc id="desc">동일한 레코드 101 ko approved, 102 ja pending, 103 ko approved를 행과 열로 표현했다. 열 저장에서는 위치가 같은 값이 같은 레코드에 속한다. language와 status만으로 집계할 때 id 열을 읽지 않아도 된다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#64748b"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#1d4ed8"/></marker></defs>
<style>text {font-family:"Noto Sans CJK KR",Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a;font-size:24px} .title{font-size:28px;font-weight:700} .label{font-size:22px;fill:#475569} .strong{font-weight:700} .accent{fill:#1d4ed8;font-weight:700} .muted{fill:#64748b}</style>
<rect width="480" height="838" rx="20" fill="#f8fafc"/>
<text x="24" y="47" class="title" text-anchor="start">같은 데이터 · 다른 저장 방향</text>
<rect x="24" y="80" width="432" height="283" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="122" class="strong" text-anchor="start">행 저장</text>
<text x="44" y="160" class="label" text-anchor="start">id / language / status</text>
<rect x="40" y="180" width="400" height="47" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
<text x="53" y="213" class="" text-anchor="start">101</text>
<text x="158" y="213" class="" text-anchor="start">ko</text>
<text x="253" y="213" class="" text-anchor="start">approved</text>
<rect x="40" y="237" width="400" height="47" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
<text x="53" y="270" class="" text-anchor="start">102</text>
<text x="158" y="270" class="" text-anchor="start">ja</text>
<text x="253" y="270" class="" text-anchor="start">pending</text>
<rect x="40" y="294" width="400" height="47" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
<text x="53" y="327" class="" text-anchor="start">103</text>
<text x="158" y="327" class="" text-anchor="start">ko</text>
<text x="253" y="327" class="" text-anchor="start">approved</text>
<text x="24" y="415" class="strong" text-anchor="start">열 저장 · 같은 위치 = 같은 행</text>
<rect x="24" y="443" width="108" height="260" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<rect x="142" y="443" width="130" height="260" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<rect x="282" y="443" width="174" height="260" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="78" y="484" class="muted" text-anchor="middle">id</text>
<text x="207" y="484" class="label" text-anchor="middle">language</text>
<text x="369" y="484" class="label" text-anchor="middle">status</text>
