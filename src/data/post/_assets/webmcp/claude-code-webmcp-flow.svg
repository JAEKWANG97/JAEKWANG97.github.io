<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1300" viewBox="0 0 480 1300" role="img" aria-labelledby="title desc"><title id="title">명령에서 웹 화면 변경까지</title><desc id="desc">사용자 요청, Claude Code 도구 선택, 별도 브라우저 연결, 웹페이지의 검색 결과 변경을 세로로 표현한 개념도.</desc><rect width="480" height="1300" fill="#f8f6f0"/><g font-family="Noto Sans CJK KR, sans-serif" fill="#242b32"><text x="24" y="42" font-size="20" fill="#ac5638">WEBMCP · 연결 구성 예시</text><text x="24" y="83" font-size="29" fill="#242b32">명령이 화면을 바꾸는 과정</text><text x="24" y="116" font-size="19" fill="#58616a">실제 제품 화면이 아닌 개념도입니다.</text><rect x="24" y="143" width="432" height="134" rx="12" fill="#e9e4d9" stroke="#d6d9d9"/><text x="44" y="178" font-size="21" fill="#242b32">1  사용자 → Claude Code</text><text x="44" y="218" font-size="22" fill="#242b32">“무선 키보드를 찾아서</text><text x="44" y="251" font-size="22" fill="#242b32">낮은 가격순으로 보여줘.”</text><path d="M240 286v24m-7-7 7 7 7-7" fill="none" stroke="#ac5638" stroke-width="2"/><rect x="24" y="325" width="432" height="153" rx="12" fill="#252e37" stroke="#d6d9d9"/><text x="44" y="361" font-size="21" fill="#fff">2  Claude Code · 도구 선택</text><text x="44" y="400" font-size="24" fill="#f0b799">search_products</text><text x="44" y="431" font-size="21" fill="#fff">query: “무선 키보드”</text><text x="44" y="461" font-size="21" fill="#fff">sort: “price_asc”</text><path d="M240 488v24m-7-7 7 7 7-7" fill="none" stroke="#ac5638" stroke-width="2"/><rect x="24" y="527" width="432" height="130" rx="12" fill="#fff" stroke="#d6d9d9"/><text x="44" y="566" font-size="23" fill="#242b32">3  브라우저 연결 계층</text><text x="44" y="601" font-size="21" fill="#ac5638">별도 연동 필요</text><text x="44" y="634" font-size="20" fill="#242b32">도구 호출을 페이지 코드에 전달</text><path d="M240 667v24m-7-7 7 7 7-7" fill="none" stroke="#ac5638" stroke-width="2"/><rect x="24" y="706" width="432" height="473" rx="12" fill="#fff" stroke="#d6d9d9"/><text x="44" y="745" font-size="23" fill="#242b32">4  웹페이지 · 검색 + UI 갱신</text><text x="44" y="789" font-size="20" fill="#58616a">실행 전</text><rect x="44" y="804" width="392" height="46" rx="6" fill="#f0f1ef"/><text x="57" y="835" font-size="21" fill="#242b32">키보드 A</text><text x="313" y="835" font-size="20" fill="#242b32">59,000원</text><rect x="44" y="860" width="392" height="46" rx="6" fill="#f0f1ef"/><text x="57" y="891" font-size="21" fill="#242b32">키보드 B</text><text x="313" y="891" font-size="20" fill="#242b32">39,000원</text><rect x="44" y="1032" width="392" height="46" rx="6" fill="#f7e7db"/><text x="57" y="1063" font-size="21" fill="#242b32">키보드 B</text><text x="313" y="1063" font-size="20" fill="#242b32">39,000원</text><rect x="44" y="1088" width="392" height="46" rx="6" fill="#f7e7db"/><text x="57" y="1119" font-size="21" fill="#242b32">키보드 A</text><text x="313" y="1119" font-size="20" fill="#242b32">59,000원</text><path d="M240 921v24m-7-7 7 7 7-7" fill="none" stroke="#ac5638" stroke-width="2"/><text x="44" y="1013" font-size="20" fill="#ac5638">실행 후 · 낮은 가격순</text><text x="24" y="1218" font-size="21" fill="#242b32">실제 검색 결과를 Claude Code에 반환</text><text x="24" y="1256" font-size="20" fill="#58616a">페이지 상태 변경 ≠ 소스 코드 수정</text></g></svg>