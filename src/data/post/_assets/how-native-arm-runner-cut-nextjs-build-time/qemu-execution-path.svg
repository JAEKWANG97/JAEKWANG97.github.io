<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">QEMU가 병목이 된 실행 경로</title>
  <desc id="desc">x64 GitHub runner에서 QEMU로 ARM64 Next.js 빌드를 실행한 변경 전 구조와 ARM64 runner에서 직접 실행한 변경 후 구조를 비교한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; fill: #0f172a; }
      .title { font-size: 52px; font-weight: 800; }
      .subtitle { font-size: 26px; fill: #475569; }
      .panel-title { font-size: 32px; font-weight: 800; }
      .label { font-size: 28px; font-weight: 700; }
      .takeaway { font-size: 24px; font-weight: 700; }
      .body { font-size: 24px; fill: #475569; }
      .small { font-size: 22px; fill: #64748b; }
      .metric { font-size: 64px; font-weight: 900; }
      .metric-label { font-size: 22px; font-weight: 700; }
      .code { font-family: "Google Sans Code", "Noto Sans Mono CJK KR", monospace; font-size: 22px; }
    </style>
  </defs>

  <rect width="1600" height="940" fill="#f8fafc"/>
  <text x="90" y="80" class="title">QEMU가 병목이 된 실행 경로</text>
  <text x="90" y="122" class="subtitle">같은 linux/arm64 이미지라도 runner 아키텍처에 따라 Docker RUN의 실행 경로가 달라진다</text>

  <rect x="70" y="170" width="700" height="630" rx="30" fill="#fff7f7" stroke="#fecaca" stroke-width="2"/>
  <rect x="830" y="170" width="700" height="630" rx="30" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>

  <circle cx="115" cy="220" r="13" fill="#dc2626"/>
  <text x="145" y="230" class="panel-title" fill="#991b1b">변경 전 · cross-architecture</text>
  <circle cx="875" cy="220" r="13" fill="#16a34a"/>
  <text x="905" y="230" class="panel-title" fill="#166534">변경 후 · native architecture</text>

  <!-- arrows are below nodes -->
  <path d="M420 350 L420 405" stroke="#dc2626" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M420 515 L420 570" stroke="#dc2626" stroke-width="5" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M1180 350 L1180 460" stroke="#16a34a" stroke-width="5" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="180" y="270" width="480" height="80" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="305" text-anchor="middle" class="label">x64 GitHub runner</text>
  <text x="420" y="334" text-anchor="middle" class="small">runs-on: ubuntu-latest</text>

  <rect x="150" y="405" width="540" height="110" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
  <text x="420" y="445" text-anchor="middle" class="label" fill="#991b1b">QEMU 우회</text>
  <text x="420" y="477" text-anchor="middle" class="code" fill="#991b1b">binfmt_misc → qemu-aarch64</text>
  <text x="420" y="504" text-anchor="middle" class="small">TCG가 ARM64 명령을 x64 명령으로 동적 변환</text>

  <rect x="180" y="570" width="480" height="90" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="608" text-anchor="middle" class="label">ARM64 Node.js + Turbopack</text>
  <text x="420" y="638" text-anchor="middle" class="code">RUN npm run build</text>

  <text x="420" y="730" text-anchor="middle" class="metric" fill="#dc2626">188.3초</text>
  <text x="420" y="762" text-anchor="middle" class="metric-label" fill="#991b1b">QEMU에서 실행</text>

  <rect x="940" y="270" width="480" height="80" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180" y="305" text-anchor="middle" class="label">ARM64 GitHub runner</text>
  <text x="1180" y="334" text-anchor="middle" class="small">runs-on: ubuntu-24.04-arm</text>

  <rect x="940" y="460" width="480" height="100" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="1180" y="500" text-anchor="middle" class="label" fill="#166534">ARM64 Node.js + Turbopack</text>
  <text x="1180" y="532" text-anchor="middle" class="code" fill="#166534">RUN npm run build · native 실행</text>

  <text x="1180" y="665" text-anchor="middle" class="metric" fill="#16a34a">13.7초</text>
  <text x="1180" y="697" text-anchor="middle" class="metric-label" fill="#166534">QEMU 경로 제거</text>

  <rect x="245" y="835" width="1110" height="66" rx="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="800" y="877" text-anchor="middle" class="takeaway" fill="#075985">이미지와 Dockerfile은 그대로 두고, 빌드 실행 경로만 native ARM으로 바꿨다</text>
</svg>
