<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Build the agent보다 Power the agent</title>
<desc id="desc">업무마다 전용 에이전트를 늘리기보다 범용 에이전트에 공통 컨텍스트·도구·권한·평가를 연결한다</desc>
