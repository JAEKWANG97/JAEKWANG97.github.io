<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Native 업무는 초안에서 끝나지 않는다</title>
<desc id="desc">목표부터 완성·전달까지 AI와 함께하되 사실과 품질에 대한 책임은 사람이 가진다</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#64748b" opacity="0.09"/></pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#7c3aed"/></marker>
  <marker id="arrowMuted" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#94a3b8"/></marker>
  <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#ef4444"/></marker>
  <style>
    text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 900; letter-spacing: 2.7px; fill: #a5b4fc; }
    .title { font-size: 43px; font-weight: 900; fill: #f8fafc; }
    .subtitle { font-size: 21px; font-weight: 550; fill: #cbd5e1; }
    .nodeTitle { font-size: 24px; font-weight: 850; fill: #0f172a; }
    .nodeSub { font-size: 17px; font-weight: 600; fill: #64748b; }
    .number { font-size: 17px; font-weight: 900; fill: #ffffff; }
    .badge { font-size: 13px; font-weight: 900; letter-spacing: 0.8px; fill: #ffffff; }
    .edge { font-size: 17px; font-weight: 800; fill: #475569; }
    .section { font-size: 22px; font-weight: 900; fill: #334155; }
    .foot { font-size: 18px; font-weight: 700; fill: #475569; }
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<path d="M36 36H1564V218H36Z" fill="url(#head)"/>
<text x="88" y="92" class="eyebrow">ORGANIZATIONAL AI TRANSFORMATION</text>
<text x="88" y="151" class="title">AI Native 업무는 초안에서 끝나지 않는다</text>
<text x="88" y="194" class="subtitle">AI 사용 범위보다 끝까지 검토하고 완성하는 책임의 연결이 중요하다</text>
<path d="M260 510L320 510" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M515 510L575 510" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M770 510L830 510" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1025 510L1085 510" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1280 510L1340 510" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="65" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="65" y="420" width="195" height="8" rx="4" fill="#475569"/><circle cx="100" cy="458" r="20" fill="#475569"/><text x="100" y="464" class="number" text-anchor="middle">01</text><text class="nodeTitle" text-anchor="middle"><tspan x="162.5" y="507.0">목표 정의</tspan></text></g>
<g filter="url(#shadow)"><rect x="320" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="320" y="420" width="195" height="8" rx="4" fill="#7c3aed"/><circle cx="355" cy="458" r="20" fill="#7c3aed"/><text x="355" y="464" class="number" text-anchor="middle">02</text><text class="nodeTitle" text-anchor="middle"><tspan x="417.5" y="507.0">AI와 초안</tspan></text></g>
<g filter="url(#shadow)"><rect x="575" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="575" y="420" width="195" height="8" rx="4" fill="#7c3aed"/><circle cx="610" cy="458" r="20" fill="#7c3aed"/><text x="610" y="464" class="number" text-anchor="middle">03</text><text class="nodeTitle" text-anchor="middle"><tspan x="672.5" y="507.0">AI와 검토·수정</tspan></text></g>
<g filter="url(#shadow)"><rect x="830" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#d97706" stroke-width="2"/><rect x="830" y="420" width="195" height="8" rx="4" fill="#d97706"/><circle cx="865" cy="458" r="20" fill="#d97706"/><text x="865" y="464" class="number" text-anchor="middle">04</text><text class="nodeTitle" text-anchor="middle"><tspan x="927.5" y="507.0">사실·품질 검증</tspan></text></g>
<g filter="url(#shadow)"><rect x="1085" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="1085" y="420" width="195" height="8" rx="4" fill="#2563eb"/><circle cx="1120" cy="458" r="20" fill="#2563eb"/><text x="1120" y="464" class="number" text-anchor="middle">05</text><text class="nodeTitle" text-anchor="middle"><tspan x="1182.5" y="507.0">완성·전달</tspan></text></g>
<g filter="url(#shadow)"><rect x="1340" y="420" width="195" height="180" rx="24" fill="#fff" stroke="#059669" stroke-width="2"/><rect x="1340" y="420" width="195" height="8" rx="4" fill="#059669"/><circle cx="1375" cy="458" r="20" fill="#059669"/><text x="1375" y="464" class="number" text-anchor="middle">06</text><text class="nodeTitle" text-anchor="middle"><tspan x="1437.5" y="507.0">결과 책임</tspan></text></g>
<path d="M1438 600C1438 730 164 730 164 610" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrowMuted)"/>
<text class="nodeSub" text-anchor="middle"><tspan x="800" y="749.0">책임과 피드백은 다음 업무의 목표 정의로 돌아간다</tspan></text>
<text x="800" y="854" class="foot" text-anchor="middle">초안을 만든 사람이 검토 비용을 동료에게 넘기지 않는다</text>
</svg>