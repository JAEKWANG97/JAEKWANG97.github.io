<svg xmlns="http://www.w3.org/2000/svg" width="960" height="980" viewBox="0 0 960 980" role="img" aria-labelledby="title desc">
  <title id="title">좁은 업무에서 현업 자립까지의 AX 로드맵</title>
  <desc id="desc">좁은 실제 업무 선택에서 시작해 업무 관찰, 최소 기반, 에이전트 투입, 사람 검증, 컨텍스트 증류, 운영과 평가, 수직 흐름 확장, 현업 운영권 이전으로 이어지는 아홉 단계.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7a7770"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; fill: #242421; }
      .step { font-size: 17px; font-weight: 850; fill: #c15f3c; letter-spacing: 1px; }
      .title { font-size: 24px; font-weight: 800; }
      .body { font-size: 17px; font-weight: 620; fill: #67655f; }
      .side { font-size: 17px; font-weight: 800; fill: #8a877f; letter-spacing: 1.6px; }
      .foot { font-size: 19px; font-weight: 700; fill: #5d5c57; }
    </style>
  </defs>

  <rect width="960" height="980" rx="28" fill="#faf9f5"/>
  <text x="55" y="55" class="side">NARROW START → ORGANIZATIONAL OWNERSHIP</text>

  <!-- vertical spine behind cards -->
  <path d="M480 102V890" stroke="#c9c5bb" stroke-width="3" fill="none"/>

  <!-- connectors -->
  <g stroke="#7a7770" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M480 158H516"/>
    <path d="M480 246H444"/>
    <path d="M480 334H516"/>
    <path d="M480 422H444"/>
    <path d="M480 510H516"/>
    <path d="M480 598H444"/>
    <path d="M480 686H516"/>
    <path d="M480 774H444"/>
    <path d="M480 862H516"/>
  </g>

  <!-- timeline dots -->
  <g fill="#faf9f5" stroke="#d97757" stroke-width="3">
    <circle cx="480" cy="158" r="10"/><circle cx="480" cy="246" r="10"/>
    <circle cx="480" cy="334" r="10"/><circle cx="480" cy="422" r="10"/>
    <circle cx="480" cy="510" r="10"/><circle cx="480" cy="598" r="10"/>
    <circle cx="480" cy="686" r="10"/><circle cx="480" cy="774" r="10"/>
    <circle cx="480" cy="862" r="10"/>
  </g>

  <g>
    <rect x="516" y="116" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="540" y="146" class="step">01</text><text x="586" y="148" class="title">좁은 실제 업무 선택</text>
    <text x="540" y="179" class="body">효과와 실패를 측정할 수 있는 한 흐름</text>

    <rect x="74" y="204" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="98" y="234" class="step">02</text><text x="144" y="236" class="title">업무 관찰</text>
    <text x="98" y="267" class="body">말로 설명되지 않은 예외와 판단 확인</text>

    <rect x="516" y="292" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="540" y="322" class="step">03</text><text x="586" y="324" class="title">최소 기반 연결</text>
    <text x="540" y="355" class="body">데이터 · 도구 · 권한 · 복구 경로</text>

    <rect x="74" y="380" width="370" height="84" rx="16" fill="#fff4ed" stroke="#d97757" stroke-width="2"/>
    <text x="98" y="410" class="step">04</text><text x="144" y="412" class="title">에이전트 실전 투입</text>
    <text x="98" y="443" class="body">데모가 아닌 실제 업무를 처음부터 끝까지</text>

    <rect x="516" y="468" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="540" y="498" class="step">05</text><text x="586" y="500" class="title">사람의 검증과 책임</text>
    <text x="540" y="531" class="body">승인 · 수정 · 반려 이유까지 기록</text>

    <rect x="74" y="556" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="98" y="586" class="step">06</text><text x="144" y="588" class="title">컨텍스트 증류</text>
    <text x="98" y="619" class="body">반복되는 기준과 예외를 검증해 재사용</text>

    <rect x="516" y="644" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="540" y="674" class="step">07</text><text x="586" y="676" class="title">운영 · 평가 · 폐기</text>
    <text x="540" y="707" class="body">품질 · 비용 · 권한 · 소유자를 지속 관리</text>

    <rect x="74" y="732" width="370" height="84" rx="16" fill="#fff" stroke="#d8d5cd" stroke-width="2"/>
    <text x="98" y="762" class="step">08</text><text x="144" y="764" class="title">수직 업무 흐름 확장</text>
    <text x="98" y="795" class="body">실행에서 보고 · 의사결정 · 후속 행동까지</text>

    <rect x="516" y="820" width="370" height="84" rx="16" fill="#eef8f2" stroke="#4e8b68" stroke-width="2"/>
    <text x="540" y="850" class="step" fill="#2f704c">09</text><text x="586" y="852" class="title">현업 운영권 이전</text>
    <text x="540" y="883" class="body">외부 AX팀 없이도 스스로 운영·개선</text>
  </g>

  <text x="480" y="946" text-anchor="middle" class="foot">AX의 완료 조건은 에이전트 배포가 아니라 현업의 자립이다</text>
</svg>
