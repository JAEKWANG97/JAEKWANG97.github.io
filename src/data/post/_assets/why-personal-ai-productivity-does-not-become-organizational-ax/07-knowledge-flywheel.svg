    .eyebrow { font-size: 17px; font-weight: 900; letter-spacing: 2.7px; fill: #a5b4fc; }
    .title { font-size: 43px; font-weight: 900; fill: #f8fafc; }
    .subtitle { font-size: 21px; font-weight: 550; fill: #cbd5e1; }
    .nodeTitle { font-size: 24px; font-weight: 850; fill: #0f172a; }
    .nodeSub { font-size: 17px; font-weight: 600; fill: #64748b; }
    .number { font-size: 17px; font-weight: 900; fill: #ffffff; }
    .badge { font-size: 13px; font-weight: 900; letter-spacing: 0.8px; fill: #ffffff; }
    .edge { font-size: 17px; font-weight: 800; fill: #475569; }
    .section { font-size: 22px; font-weight: 900; fill: #334155; }
    .foot { font-size: 18px; font-weight: 700; fill: #475569; }
  </style>
