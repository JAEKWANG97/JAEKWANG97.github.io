<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">도구 도입과 AI Native 전환은 다르다</title>
<desc id="desc">AI를 지급했는지가 아니라 업무 방식과 책임 구조가 실제로 바뀌었는지가 분기점이다</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#64748b" opacity="0.09"/></pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#2563eb"/></marker>
  <marker id="arrowMuted" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#94a3b8"/></marker>
  <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#ef4444"/></marker>
  <style>
    text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 900; letter-spacing: 2.7px; fill: #a5b4fc; }
    .title { font-size: 43px; font-weight: 900; fill: #f8fafc; }
    .subtitle { font-size: 21px; font-weight: 550; fill: #cbd5e1; }
    .nodeTitle { font-size: 24px; font-weight: 850; fill: #0f172a; }
    .nodeSub { font-size: 17px; font-weight: 600; fill: #64748b; }
    .number { font-size: 17px; font-weight: 900; fill: #ffffff; }
    .badge { font-size: 13px; font-weight: 900; letter-spacing: 0.8px; fill: #ffffff; }
    .edge { font-size: 17px; font-weight: 800; fill: #475569; }
    .section { font-size: 22px; font-weight: 900; fill: #334155; }
    .foot { font-size: 18px; font-weight: 700; fill: #475569; }
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<path d="M36 36H1564V218H36Z" fill="url(#head)"/>
<text x="88" y="92" class="eyebrow">ORGANIZATIONAL AI TRANSFORMATION</text>
<text x="88" y="151" class="title">도구 도입과 AI Native 전환은 다르다</text>
<text x="88" y="194" class="subtitle">도구는 출발점이고, 조직 변화는 별도의 선택이다</text>
<path d="M340 505L475 505" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M735 505C790 505 800 365 865 365" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M735 505C790 505 800 645 865 645" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowRed)"/>
<path d="M1125 365L1260 365" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="90" y="405" width="250" height="200" rx="24" fill="#ffffff" stroke="#475569" stroke-width="2"/><rect x="90" y="405" width="250" height="8" rx="4" fill="#475569"/><circle cx="125" cy="443" r="20" fill="#475569"/><text x="125" y="449" class="number" text-anchor="middle">01</text><text class="nodeTitle" text-anchor="middle"><tspan x="215.0" y="492.0">Legacy Team</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="215.0" y="573.0">기존 역할·프로세스</tspan></text></g>
<g filter="url(#shadow)"><rect x="475" y="405" width="260" height="200" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="475" y="405" width="260" height="8" rx="4" fill="#0ea5e9"/><circle cx="510" cy="443" r="20" fill="#0ea5e9"/><text x="510" y="449" class="number" text-anchor="middle">02</text><text class="nodeTitle" text-anchor="middle"><tspan x="605.0" y="492.0">AI 도구 지급</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="605.0" y="573.0">접근 권한과 교육</tspan></text></g>
<g filter="url(#shadow)"><rect x="865" y="270" width="260" height="190" rx="24" fill="#f0fdf4" stroke="#059669" stroke-width="2"/><rect x="865" y="270" width="260" height="8" rx="4" fill="#059669"/><rect x="881" y="289" width="64" height="36" rx="18" fill="#059669"/><text x="913.0" y="313" class="badge" text-anchor="middle">YES</text><text class="nodeTitle" text-anchor="middle"><tspan x="995.0" y="357.0">업무 방식이 바뀜</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="995.0" y="428.0">처음부터 끝까지 AI와 수행</tspan></text></g>
<g filter="url(#shadow)"><rect x="865" y="550" width="260" height="190" rx="24" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="865" y="550" width="260" height="8" rx="4" fill="#dc2626"/><circle cx="900" cy="588" r="20" fill="#dc2626"/><text x="900" y="594" class="number" text-anchor="middle">NO</text><text class="nodeTitle" text-anchor="middle"><tspan x="995.0" y="637.0">업무 방식은 그대로</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="995.0" y="708.0">기존 프로세스에 기능만 추가</tspan></text></g>
<g filter="url(#shadow)"><rect x="1260" y="270" width="260" height="190" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="1260" y="270" width="260" height="8" rx="4" fill="#7c3aed"/><circle cx="1295" cy="308" r="20" fill="#7c3aed"/><text x="1295" y="314" class="number" text-anchor="middle">03</text><text class="nodeTitle" text-anchor="middle"><tspan x="1390.0" y="357.0">AI Native Team</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="1390.0" y="428.0">역할·책임·평가·협업 변화</tspan></text></g>
<rect x="757" y="363" width="86" height="31" rx="15" fill="#fff"/><text x="800" y="385" text-anchor="middle" class="edge" fill="#059669">예</text>
<rect x="757" y="608" width="86" height="31" rx="15" fill="#fff"/><text x="800" y="630" text-anchor="middle" class="edge" fill="#dc2626">아니오</text>
<text x="800" y="854" class="foot" text-anchor="middle">같은 도구를 써도 조직의 일하는 방식이 그대로라면 AX가 아니다</text>
</svg>