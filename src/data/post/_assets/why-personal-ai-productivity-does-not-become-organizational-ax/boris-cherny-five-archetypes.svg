<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">보리스 체르니가 제안한 다섯 역할과 제품 성숙도별 팀 구성</title>
  <desc id="desc">Prototyper, Builder, Sweeper, Grower, Maintainer의 역할을 설명하고, PMF 이전·성장 중·강한 PMF 단계에서 필요한 역할의 비중을 시각화한 표.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#64748b" opacity="0.10"/>
    </pattern>
    <style>
      text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 17px; font-weight: 900; letter-spacing: 2.8px; fill: #a5b4fc; }
      .title { font-size: 44px; font-weight: 900; fill: #f8fafc; }
      .subtitle { font-size: 21px; fill: #cbd5e1; }
      .role { font-size: 22px; font-weight: 900; }
      .roleKo { font-size: 17px; font-weight: 650; fill: #475569; }
      .stage { font-size: 21px; font-weight: 900; fill: #f8fafc; }
      .stageSub { font-size: 15px; font-weight: 600; fill: #cbd5e1; }
      .legend { font-size: 17px; font-weight: 750; fill: #475569; }
      .note { font-size: 18px; font-weight: 700; fill: #334155; }
      .source { font-size: 14px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect width="1600" height="980" fill="url(#dots)"/>
  <rect x="56" y="48" width="1488" height="884" rx="36" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M92 48H1508Q1544 48 1544 84V245H56V84Q56 48 92 48Z" fill="url(#header)"/>

  <text x="105" y="99" class="eyebrow">FIVE ARCHETYPES · BORIS CHERNY</text>
  <text x="105" y="158" class="title">직무명이 아니라 제품에 기여하는 방식으로 팀을 본다</text>
  <text x="105" y="202" class="subtitle">한 사람은 2~3개의 역할을 함께 가질 수 있고, 필요한 조합은 제품의 성숙도에 따라 달라진다</text>

  <!-- column headers -->
  <g>
    <rect x="104" y="278" width="348" height="86" rx="22" fill="#f1f5f9"/>
    <text x="128" y="315" class="role" fill="#64748b">역할 원형</text>
    <text x="128" y="341" class="roleKo">무엇을 책임지는가</text>

    <rect x="478" y="278" width="312" height="86" rx="22" fill="#4338ca"/>
    <text x="634" y="315" text-anchor="middle" class="stage">PMF 이전</text>
    <text x="634" y="341" text-anchor="middle" class="stageSub">새로운 제품</text>

    <rect x="816" y="278" width="312" height="86" rx="22" fill="#7c3aed"/>
    <text x="972" y="315" text-anchor="middle" class="stage">PMF를 찾고 성장 중</text>
    <text x="972" y="341" text-anchor="middle" class="stageSub">반복 개선 단계</text>

    <rect x="1154" y="278" width="342" height="86" rx="22" fill="#0f766e"/>
    <text x="1325" y="315" text-anchor="middle" class="stage">강한 PMF 확보</text>
    <text x="1325" y="341" text-anchor="middle" class="stageSub">성숙·확장 단계</text>
  </g>

  <!-- row backgrounds -->
  <g>
    <rect x="104" y="384" width="1392" height="88" rx="18" fill="#fff7ed"/>
    <rect x="104" y="484" width="1392" height="88" rx="18" fill="#eff6ff"/>
    <rect x="104" y="584" width="1392" height="88" rx="18" fill="#f5f3ff"/>
    <rect x="104" y="684" width="1392" height="88" rx="18" fill="#f0fdf4"/>
    <rect x="104" y="784" width="1392" height="88" rx="18" fill="#ecfeff"/>
  </g>

  <!-- role identity -->
  <g>
    <circle cx="145" cy="428" r="25" fill="#fb923c"/>
    <path d="M137 428L144 435L156 418" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="421" class="role" fill="#c2410c">Prototyper</text>
    <text x="184" y="451" class="roleKo">새 아이디어와 가능성을 빠르게 탐색</text>

    <circle cx="145" cy="528" r="25" fill="#3b82f6"/>
    <path d="M133 535L145 511L157 535Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <text x="184" y="521" class="role" fill="#1d4ed8">Builder</text>
    <text x="184" y="551" class="roleKo">프로토타입을 프로덕션 제품·인프라로 전환</text>

    <circle cx="145" cy="628" r="25" fill="#8b5cf6"/>
    <path d="M133 632L141 624L148 631L158 618" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="621" class="role" fill="#6d28d9">Sweeper</text>
    <text x="184" y="651" class="roleKo">단순화·삭제·성능 최적화</text>

    <circle cx="145" cy="728" r="25" fill="#22c55e"/>
    <path d="M134 737V720H143V713H152V704H159" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="721" class="role" fill="#15803d">Grower</text>
    <text x="184" y="751" class="roleKo">반복 개선으로 Product-Market Fit 강화</text>

    <circle cx="145" cy="828" r="25" fill="#06b6d4"/>
    <path d="M145 810L158 818V831C158 839 151 844 145 847C139 844 132 839 132 831V818Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text x="184" y="821" class="role" fill="#0e7490">Maintainer</text>
    <text x="184" y="851" class="roleKo">성숙한 시스템의 보안·신뢰성·속도·효율</text>
  </g>

  <!-- matrix connectors behind dots -->
  <g stroke-width="8" stroke-linecap="round" opacity="0.28">
    <path d="M540 428H728" stroke="#fb923c"/>
    <path d="M540 528H1418" stroke="#3b82f6"/>
    <path d="M540 628H1418" stroke="#8b5cf6"/>
    <path d="M878 728H1418" stroke="#22c55e"/>
    <path d="M1012 828H1418" stroke="#06b6d4" stroke-dasharray="10 16"/>
  </g>

  <!-- matrix dots: strong 22, some 13, absent 5 -->
  <g stroke="#fff" stroke-width="5">
    <!-- prototyper -->
    <circle cx="634" cy="428" r="22" fill="#fb923c"/>
    <circle cx="972" cy="428" r="6" fill="#cbd5e1" stroke-width="0"/>
    <circle cx="1325" cy="428" r="6" fill="#cbd5e1" stroke-width="0"/>

    <!-- builder -->
    <circle cx="634" cy="528" r="22" fill="#3b82f6"/>
    <circle cx="972" cy="528" r="22" fill="#3b82f6"/>
    <circle cx="1325" cy="528" r="13" fill="#93c5fd"/>

    <!-- sweeper -->
    <circle cx="634" cy="628" r="22" fill="#8b5cf6"/>
    <circle cx="972" cy="628" r="22" fill="#8b5cf6"/>
    <circle cx="1325" cy="628" r="22" fill="#8b5cf6"/>

    <!-- grower -->
    <circle cx="634" cy="728" r="6" fill="#cbd5e1" stroke-width="0"/>
    <circle cx="972" cy="728" r="22" fill="#22c55e"/>
    <circle cx="1325" cy="728" r="22" fill="#22c55e"/>

    <!-- maintainer -->
    <circle cx="634" cy="828" r="6" fill="#cbd5e1" stroke-width="0"/>
    <circle cx="972" cy="828" r="13" fill="#67e8f9"/>
    <circle cx="1325" cy="828" r="22" fill="#06b6d4"/>
  </g>

  <g transform="translate(105 908)">
    <circle cx="0" cy="0" r="12" fill="#4338ca"/>
    <text x="22" y="6" class="legend">핵심 역할</text>
    <circle cx="142" cy="0" r="8" fill="#a5b4fc"/>
    <text x="158" y="6" class="legend">일부 필요</text>
    <text x="474" y="6" class="note">역할은 직무가 아니며 한 사람이 여러 원형에 걸칠 수 있다</text>
    <text x="1390" y="6" text-anchor="end" class="source">Source · Boris Cherny, Claude Code team archetypes</text>
  </g>
</svg>
