<path d="M36 36H1564V218H36Z" fill="url(#head)"/>
<text x="88" y="92" class="eyebrow">ORGANIZATIONAL AI TRANSFORMATION</text>
<text x="88" y="151" class="title">전사 AX는 좁은 업무에서 현업 자립까지 확장한다</text>
