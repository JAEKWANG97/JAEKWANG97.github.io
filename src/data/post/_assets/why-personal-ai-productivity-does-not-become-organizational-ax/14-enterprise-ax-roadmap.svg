<g filter="url(#shadow)"><rect x="185" y="535" width="250" height="150" rx="24" fill="#f0fdf4" stroke="#059669" stroke-width="2"/><rect x="185" y="535" width="250" height="8" rx="4" fill="#059669"/><circle cx="220" cy="573" r="20" fill="#059669"/><text x="220" y="579" class="number" text-anchor="middle">09</text><text class="nodeTitle" text-anchor="middle"><tspan x="310.0" y="622.0">현업 운영권 이전</tspan></text></g>
<text x="800" y="854" class="foot" text-anchor="middle">외부 AX팀이 빠진 뒤에도 현업이 스스로 운영할 수 있어야 완료다</text>
