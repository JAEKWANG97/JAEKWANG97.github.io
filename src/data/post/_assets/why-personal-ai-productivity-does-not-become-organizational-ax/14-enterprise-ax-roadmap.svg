<g filter="url(#shadow)"><rect x="345" y="225" width="250" height="150" rx="24" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="345" y="225" width="250" height="8" rx="4" fill="#2563eb"/><circle cx="380" cy="263" r="20" fill="#2563eb"/><text x="380" y="269" class="number" text-anchor="middle">02</text><text class="nodeTitle" text-anchor="middle"><tspan x="470.0" y="312.0">업무 관찰</tspan></text></g>
