<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc" data-renderer="roughjs-4.6.6">
  <title id="title">효능 증명, 조직 확산, 지속 가능한 운영</title>
  <desc id="desc">AX가 실제 문제 해결에서 조직 확산을 거쳐 현업의 지속 가능한 운영으로 이어지는 세 단계와, 각 단계에서 멈췄을 때 남는 한계를 보여준다.</desc>
