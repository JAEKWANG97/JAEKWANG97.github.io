<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Build the agent와 Power the agent 비교</title>
  <desc id="desc">업무마다 전용 에이전트와 지식베이스를 늘리는 구조를, 하나의 범용 에이전트에 공통 컨텍스트와 도구, 권한, 평가를 연결하는 구조와 비교한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#5d5c57"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; fill: #242421; }
      .kicker { font-size: 18px; font-weight: 800; letter-spacing: 2px; }
      .heading { font-size: 27px; font-weight: 800; }
      .node { font-size: 20px; font-weight: 750; }
      .small { font-size: 17px; font-weight: 650; fill: #67655f; }
      .foot { font-size: 19px; font-weight: 700; fill: #5d5c57; }
    </style>
  </defs>

  <rect width="960" height="700" rx="28" fill="#faf9f5"/>

  <text x="54" y="55" class="kicker" fill="#8c5142">BUILD THE AGENT</text>
  <text x="506" y="55" class="kicker" fill="#c15f3c">POWER THE AGENT</text>

  <rect x="40" y="82" width="400" height="524" rx="22" fill="#f4f1ec" stroke="#d8d5cd" stroke-width="2"/>
  <rect x="480" y="82" width="440" height="524" rx="22" fill="#fff4ed" stroke="#d97757" stroke-width="2"/>

  <text x="72" y="128" class="heading">업무마다 따로 만든다</text>
  <text x="512" y="128" class="heading">일할 조건을 연결한다</text>

  <!-- left connectors -->
  <g stroke="#aaa69d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M230 210H302"/>
    <path d="M230 330H302"/>
    <path d="M230 450H302"/>
  </g>

  <g>
    <rect x="72" y="172" width="158" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="151" y="219" text-anchor="middle" class="node">에이전트 A</text>
    <rect x="302" y="172" width="106" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="355" y="201" text-anchor="middle" class="small">지식</text><text x="355" y="228" text-anchor="middle" class="small">A</text>

    <rect x="72" y="292" width="158" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="151" y="339" text-anchor="middle" class="node">에이전트 B</text>
    <rect x="302" y="292" width="106" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="355" y="321" text-anchor="middle" class="small">지식</text><text x="355" y="348" text-anchor="middle" class="small">B</text>

    <rect x="72" y="412" width="158" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="151" y="459" text-anchor="middle" class="node">에이전트 C</text>
    <rect x="302" y="412" width="106" height="76" rx="14" fill="#fff" stroke="#b8b4aa" stroke-width="2"/>
    <text x="355" y="441" text-anchor="middle" class="small">지식</text><text x="355" y="468" text-anchor="middle" class="small">C</text>
  </g>
  <text x="240" y="548" text-anchor="middle" class="small">중복된 프롬프트 · 권한 · 운영 책임</text>
  <text x="240" y="578" text-anchor="middle" class="small">늘어나는 개수가 곧 운영 부채가 된다</text>

  <!-- right connectors behind nodes -->
  <g stroke="#d97757" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M694 334C750 334 758 196 808 196"/>
    <path d="M694 334C750 334 758 286 808 286"/>
    <path d="M694 334C750 334 758 376 808 376"/>
    <path d="M694 334C750 334 758 466 808 466"/>
  </g>

  <rect x="518" y="247" width="176" height="174" rx="22" fill="#fff" stroke="#d97757" stroke-width="3"/>
  <circle cx="606" cy="294" r="21" fill="#d97757"/>
  <path d="M596 294H616M606 284V304" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="606" y="350" text-anchor="middle" class="node">범용 에이전트</text>
  <text x="606" y="381" text-anchor="middle" class="small">업무를 직접 수행</text>

  <g>
    <rect x="808" y="160" width="82" height="72" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="849" y="203" text-anchor="middle" class="small">컨텍스트</text>
    <rect x="808" y="250" width="82" height="72" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="849" y="293" text-anchor="middle" class="small">도구·API</text>
    <rect x="808" y="340" width="82" height="72" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="849" y="383" text-anchor="middle" class="small">권한</text>
    <rect x="808" y="430" width="82" height="72" rx="14" fill="#fff" stroke="#d97757" stroke-width="2"/>
    <text x="849" y="473" text-anchor="middle" class="small">평가·로그</text>
  </g>
  <text x="700" y="548" text-anchor="middle" class="small">같은 정책과 검증을 공유한다</text>
  <text x="700" y="578" text-anchor="middle" class="small">새 에이전트보다 실행 환경을 강화한다</text>

  <line x1="54" y1="642" x2="906" y2="642" stroke="#d8d5cd" stroke-width="2"/>
  <text x="480" y="678" text-anchor="middle" class="foot">개수를 늘리는 설계에서 컨텍스트와 통제를 연결하는 설계로</text>
</svg>
