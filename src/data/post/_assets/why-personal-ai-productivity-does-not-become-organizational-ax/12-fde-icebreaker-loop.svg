<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">FDE는 첫 경로를 만들고 운영권을 넘긴다</title>
<desc id="desc">현장 관찰과 빠른 실험을 반복해 문제와 해법을 함께 찾되 최종 목적은 현업의 자립이다</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#64748b" opacity="0.09"/></pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/></filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#0ea5e9"/></marker>
  <marker id="arrowMuted" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#94a3b8"/></marker>
  <marker id="arrowRed" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M0 0L13 6.5L0 13Z" fill="#ef4444"/></marker>
  <style>
    text { font-family: "Noto Sans CJK KR", "Pretendard", sans-serif; }
    .eyebrow { font-size: 17px; font-weight: 900; letter-spacing: 2.7px; fill: #a5b4fc; }
    .title { font-size: 43px; font-weight: 900; fill: #f8fafc; }
    .subtitle { font-size: 21px; font-weight: 550; fill: #cbd5e1; }
    .nodeTitle { font-size: 24px; font-weight: 850; fill: #0f172a; }
    .nodeSub { font-size: 17px; font-weight: 600; fill: #64748b; }
    .number { font-size: 17px; font-weight: 900; fill: #ffffff; }
    .badge { font-size: 13px; font-weight: 900; letter-spacing: 0.8px; fill: #ffffff; }
    .edge { font-size: 17px; font-weight: 800; fill: #475569; }
    .section { font-size: 22px; font-weight: 900; fill: #334155; }
    .foot { font-size: 18px; font-weight: 700; fill: #475569; }
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<path d="M36 36H1564V218H36Z" fill="url(#head)"/>
<text x="88" y="92" class="eyebrow">ORGANIZATIONAL AI TRANSFORMATION</text>
<text x="88" y="151" class="title">FDE는 첫 경로를 만들고 운영권을 넘긴다</text>
<text x="88" y="194" class="subtitle">쇄빙선은 길을 열지만 그 길의 영구 운전자가 되지 않는다</text>
<path d="M280 470L330 470" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M540 470L590 470" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M800 470L850 470" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M1060 470L1110 470" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="70" y="380" width="210" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="70" y="380" width="210" height="8" rx="4" fill="#0ea5e9"/><circle cx="105" cy="418" r="20" fill="#0ea5e9"/><text x="105" y="424" class="number" text-anchor="middle">01</text><text class="nodeTitle" text-anchor="middle"><tspan x="175.0" y="467.0">현장 투입</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="175.0" y="528.0">도메인 학습</tspan></text></g>
<g filter="url(#shadow)"><rect x="330" y="380" width="210" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="330" y="380" width="210" height="8" rx="4" fill="#0ea5e9"/><circle cx="365" cy="418" r="20" fill="#0ea5e9"/><text x="365" y="424" class="number" text-anchor="middle">02</text><text class="nodeTitle" text-anchor="middle"><tspan x="435.0" y="467.0">업무 관찰</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="435.0" y="528.0">행동·예외 파악</tspan></text></g>
<g filter="url(#shadow)"><rect x="590" y="380" width="210" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="590" y="380" width="210" height="8" rx="4" fill="#0ea5e9"/><circle cx="625" cy="418" r="20" fill="#0ea5e9"/><text x="625" y="424" class="number" text-anchor="middle">03</text><text class="nodeTitle" text-anchor="middle"><tspan x="695.0" y="467.0">문제 가설</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="695.0" y="528.0">검증 가능한 질문</tspan></text></g>
<g filter="url(#shadow)"><rect x="850" y="380" width="210" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="850" y="380" width="210" height="8" rx="4" fill="#0ea5e9"/><circle cx="885" cy="418" r="20" fill="#0ea5e9"/><text x="885" y="424" class="number" text-anchor="middle">04</text><text class="nodeTitle" text-anchor="middle"><tspan x="955.0" y="467.0">작동하는 결과물</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="955.0" y="528.0">말 대신 실행</tspan></text></g>
<g filter="url(#shadow)"><rect x="1110" y="380" width="210" height="180" rx="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><rect x="1110" y="380" width="210" height="8" rx="4" fill="#0ea5e9"/><circle cx="1145" cy="418" r="20" fill="#0ea5e9"/><text x="1145" y="424" class="number" text-anchor="middle">05</text><text class="nodeTitle" text-anchor="middle"><tspan x="1215.0" y="467.0">현업 확인</tspan></text><text class="nodeSub" text-anchor="middle"><tspan x="1215.0" y="528.0">반응으로 수정</tspan></text></g>
<path d="M1215 560C1215 730 760 730 720 675" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="500" y="635" width="440" height="110" rx="24" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><rect x="500" y="635" width="440" height="8" rx="4" fill="#7c3aed"/><text class="nodeTitle" text-anchor="middle"><tspan x="720.0" y="690.0">문제·해법 수정 후 다시 실험</tspan></text></g>
<path d="M1320 470L1435 470" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="1435" y="380" width="125" height="180" rx="24" fill="#f0fdf4" stroke="#059669" stroke-width="2"/><rect x="1435" y="380" width="125" height="8" rx="4" fill="#059669"/><text class="nodeTitle" text-anchor="middle"><tspan x="1497.5" y="455.5">현업</tspan><tspan x="1497.5" y="484.5">운영권</tspan></text></g>
<text x="800" y="854" class="foot" text-anchor="middle">성공의 기준은 FDE 의존이 아니라 현업이 직접 운영·개선하는 상태다</text>
</svg>