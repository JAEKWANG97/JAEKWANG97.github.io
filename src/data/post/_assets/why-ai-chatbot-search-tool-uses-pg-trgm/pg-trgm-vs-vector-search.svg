<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">pg_trgm과 벡터 검색 선택 기준</title><desc id="desc">문자열 모양을 찾을 때는 pg_trgm, 표현이 달라도 같은 의미를 찾을 때는 벡터 검색을 검토한다</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:25px;font-weight:750}.b{font-size:18px;fill:#334155}.n{font-size:16px;fill:#64748b}.m{font-family:"JetBrains Mono",monospace;font-size:18px;fill:#312e81}.q{font-size:21px;font-weight:700}</style></defs><rect width="1200" height="690" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">검색 기술은 “AI인가?”가 아니라 “무엇이 비슷한가?”로 고른다</text><text x="60" y="101" class="c">문자열의 모양과 문장의 의미는 서로 다른 유사성이다.</text><rect x="375" y="140" width="450" height="78" rx="25" fill="#fff3bf" stroke="#eab308" stroke-width="2"/><text x="600" y="174" text-anchor="middle" class="q">찾으려는 비슷함은 무엇인가?</text><text x="600" y="201" text-anchor="middle" class="n">검색 대상과 사용자의 입력 형태부터 확인</text><path d="M520 220L310 286" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M680 220L890 286" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><g filter="url(#s)"><rect x="65" y="285" width="500" height="300" rx="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><rect x="635" y="285" width="500" height="300" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/></g><text x="315" y="333" text-anchor="middle" class="h">문자열 모양이 비슷하다</text><text x="885" y="333" text-anchor="middle" class="h">표현은 달라도 의미가 비슷하다</text><text x="315" y="382" text-anchor="middle" class="m">postgre → PostgreSQL</text><text x="315" y="422" text-anchor="middle" class="m">kafaka → Kafka</text><text x="315" y="469" text-anchor="middle" class="b">부분 문자열 · 대소문자 · 가벼운 오타</text><rect x="190" y="505" width="250" height="52" rx="26" fill="#c7d2fe" stroke="#4f46e5"/><text x="315" y="538" text-anchor="middle" class="q">pg_trgm</text><text x="885" y="378" text-anchor="middle" class="b">“DB 조회가 느릴 때 뭘 보지?”</text><text x="885" y="424" text-anchor="middle" class="b">↓ 관련 문서</text><text x="885" y="466" text-anchor="middle" class="b">“PostgreSQL 실행 계획 분석”</text><rect x="760" y="505" width="250" height="52" rx="26" fill="#bbf7d0" stroke="#16a34a"/><text x="885" y="538" text-anchor="middle" class="q">벡터 검색 검토</text><rect x="180" y="620" width="840" height="46" rx="23" fill="#fff" stroke="#cbd5e1"/><text x="600" y="650" text-anchor="middle" class="b">이름 검색과 본문 검색을 분리해 두 방식을 함께 사용할 수도 있다.</text></svg>