<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">pg_trgm과 GIN 인덱스의 역할 분리</title>
  <desc id="desc">pg_trgm이 문자열을 trigram으로 나누고 GIN이 각 trigram과 행 번호의 관계를 역색인하는 과정</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 750; }
      .claim { font-size: 20px; fill: #475569; }
      .step { font-size: 18px; font-weight: 750; fill: #64748b; }
      .node-title { font-size: 24px; font-weight: 750; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .code { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; font-size: 18px; fill: #312e81; }
      .token { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; font-size: 19px; font-weight: 700; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="65" class="title">pg_trgm은 검색 규칙을 만들고, GIN은 검색 경로를 저장한다</text>
  <text x="60" y="101" class="claim">두 기술은 같은 것이 아니라 문자열 분해와 역색인이라는 서로 다른 역할을 맡는다.</text>

  <path d="M285 285 H350" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 285 H675" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M935 285 H1000" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="230" height="240" rx="22" fill="#fff3bf" stroke="#eab308" stroke-width="2"/>
    <rect x="350" y="165" width="260" height="240" rx="22" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="675" y="165" width="260" height="240" rx="22" fill="#a5d8ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="1000" y="165" width="145" height="240" rx="22" fill="#b2f2bb" stroke="#16a34a" stroke-width="2"/>
  </g>

  <text x="78" y="198" class="step">1 · 원본</text>
  <text x="170" y="248" text-anchor="middle" class="node-title">문자열</text>
  <text x="170" y="303" text-anchor="middle" class="code">postgresql</text>
  <text x="170" y="351" text-anchor="middle" class="small">행 3번에 저장</text>

  <text x="373" y="198" class="step">2 · 검색 단위 생성</text>
  <text x="480" y="240" text-anchor="middle" class="node-title">pg_trgm</text>
  <rect x="375" y="270" width="62" height="42" rx="10" fill="#ffffff" stroke="#8b5cf6"/>
  <rect x="448" y="270" width="62" height="42" rx="10" fill="#ffffff" stroke="#8b5cf6"/>
  <rect x="521" y="270" width="62" height="42" rx="10" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="406" y="297" text-anchor="middle" class="token">pos</text>
  <text x="479" y="297" text-anchor="middle" class="token">ost</text>
  <text x="552" y="297" text-anchor="middle" class="token">stg</text>
  <text x="480" y="346" text-anchor="middle" class="body">세 문자 조각 생성</text>
  <text x="480" y="375" text-anchor="middle" class="small">유사도 함수·연산자 제공</text>

  <text x="698" y="198" class="step">3 · 역색인</text>
  <text x="805" y="240" text-anchor="middle" class="node-title">GIN</text>
  <text x="705" y="287" class="token">pos</text>
  <text x="765" y="287" class="body">→ 3, 17</text>
  <text x="705" y="327" class="token">ost</text>
  <text x="765" y="327" class="body">→ 3, 17</text>
  <text x="705" y="367" class="token">sql</text>
  <text x="765" y="367" class="body">→ 3, 17, 29</text>

  <text x="1020" y="198" class="step">4 · 조회</text>
  <text x="1072" y="248" text-anchor="middle" class="node-title">후보</text>
  <circle cx="1072" cy="298" r="25" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1072" y="305" text-anchor="middle" class="token">3</text>
  <circle cx="1072" cy="359" r="25" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1072" y="366" text-anchor="middle" class="token">17</text>

  <rect x="75" y="475" width="1050" height="165" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="514" class="node-title">B-tree와 질문이 다르다</text>
  <line x1="600" y1="505" x2="600" y2="612" stroke="#cbd5e1" stroke-width="2"/>
  <text x="115" y="558" class="body">B-tree</text>
  <text x="205" y="558" class="small">정렬된 값 중 어느 범위를 읽을까?</text>
  <text x="115" y="596" class="code">LIKE 'postgre%'</text>
  <text x="635" y="558" class="body">pg_trgm + GIN</text>
  <text x="820" y="558" class="small">이 조각을 가진 행은 무엇일까?</text>
  <text x="635" y="596" class="code">ILIKE '%postgre%'</text>

  <rect x="230" y="676" width="740" height="52" rx="26" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="709" text-anchor="middle" class="body">후보를 찾은 뒤 PostgreSQL이 원래 조건으로 최종 확인한다.</text>
</svg>
