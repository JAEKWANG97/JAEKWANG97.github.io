<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">검색 결과 우선순위</title><desc id="desc">정확 일치, 접두사 일치, 부분 포함, trigram 유사 일치 순으로 검색 결과의 우선순위를 정하는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:23px;font-weight:750}.b{font-size:18px;fill:#334155}.n{font-size:16px;fill:#64748b}.m{font-family:"JetBrains Mono",monospace;font-size:17px;fill:#312e81}.rank{font-size:22px;font-weight:800}</style></defs><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">같은 후보라도 “어떻게 일치했는가”에 따라 순서를 정한다</text><text x="60" y="101" class="c">사용자가 입력한 문자열을 더 직접적으로 만족하는 결과부터 보여준다.</text><path d="M165 170V580" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/><text x="112" y="156" class="n">우선</text><text x="112" y="615" class="n">후순위</text><g filter="url(#s)"><rect x="220" y="145" width="860" height="100" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><rect x="220" y="265" width="770" height="100" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><rect x="220" y="385" width="680" height="100" rx="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><rect x="220" y="505" width="590" height="100" rx="20" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/></g><text x="255" y="180" class="rank">1</text><text x="305" y="180" class="h">정확 일치</text><text x="305" y="219" class="m">lower(name) = lower('postgresql')</text><text x="255" y="300" class="rank">2</text><text x="305" y="300" class="h">접두사 일치</text><text x="305" y="339" class="m">name ILIKE 'postgre%'</text><text x="255" y="420" class="rank">3</text><text x="305" y="420" class="h">부분 포함</text><text x="305" y="459" class="m">name ILIKE '%postgre%'</text><text x="255" y="540" class="rank">4</text><text x="305" y="540" class="h">trigram 유사 일치</text><text x="305" y="579" class="m">name % 'postgre'</text><text x="865" y="205" class="b">가장 직접적인 답</text><text x="785" y="325" class="b">이름의 시작이 일치</text><text x="695" y="445" class="b">이름 중간에 포함</text><text x="605" y="565" class="b">오타까지 후보로 허용</text><rect x="275" y="630" width="650" height="38" rx="19" fill="#fff" stroke="#cbd5e1"/><text x="600" y="655" text-anchor="middle" class="n">순위 규칙은 서비스 데이터와 사용자 입력으로 검증해서 조정한다.</text></svg>