<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">B-tree와 선행 와일드카드 검색 비교</title><desc id="desc">접두사가 고정된 검색은 정렬 범위를 좁힐 수 있지만 선행 와일드카드 검색은 시작 지점을 정하기 어렵다</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:25px;font-weight:750}.b{font-size:18px;fill:#334155}.m{font-family:"JetBrains Mono",monospace;font-size:18px}.ok{fill:#166534;font-weight:700}.no{fill:#b91c1c;font-weight:700}.n{font-size:16px;fill:#64748b}</style></defs><rect width="1200" height="660" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">B-tree는 시작 지점을 알 때 빠르게 범위를 좁힌다</text><text x="60" y="101" class="c">문제는 LIKE가 아니라 검색어 앞의 % 때문에 시작 위치가 사라지는 것이다.</text><g filter="url(#s)"><rect x="55" y="150" width="520" height="420" rx="24" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/><rect x="625" y="150" width="520" height="420" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/></g><text x="315" y="195" text-anchor="middle" class="h">LIKE 'Postgre%'</text><text x="885" y="195" text-anchor="middle" class="h">ILIKE '%postgre%'</text><text x="315" y="230" text-anchor="middle" class="ok">접두사 고정 → 시작 범위 계산 가능</text><text x="885" y="230" text-anchor="middle" class="no">앞부분 미정 → 시작 위치를 알 수 없음</text><g class="m"><text x="150" y="292">MySQL Guide</text><text x="150" y="337">Oracle Backup</text><rect x="125" y="358" width="375" height="100" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="150" y="397">PostgreSQL Guide</text><text x="150" y="442">PostgreSQL Tuning</text><text x="150" y="502">Redis Guide</text></g><path d="M90 370H120" stroke="#166534" stroke-width="4" marker-end="url(#a)"/><text x="70" y="337" class="n">여기부터</text><g class="m"><text x="690" y="292">MySQL + PostgreSQL</text><text x="690" y="337">PostgreSQL Guide</text><text x="690" y="382">Redis Guide</text><text x="690" y="427">운영 환경의 PostgreSQL</text><text x="690" y="472">쉽게 배우는 PostgreSQL</text><text x="690" y="517">Spring Boot</text></g><path d="M1090 285V520" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 7"/><text x="885" y="552" text-anchor="middle" class="n">일치 행이 정렬된 한 구간에 모이지 않는다</text><rect x="170" y="595" width="860" height="44" rx="22" fill="#e0f2fe" stroke="#38bdf8"/><text x="600" y="624" text-anchor="middle" class="b">B-tree의 한계가 아니라, 정렬 범위를 만들 수 없는 검색 조건의 한계다.</text></svg>