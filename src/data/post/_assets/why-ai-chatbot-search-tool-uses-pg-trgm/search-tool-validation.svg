<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">검색 Tool 검증의 두 축</title><desc id="desc">실행 계획으로 성능을 확인하고 대표 검색어 테스트로 검색 품질을 확인하는 검증 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:25px;font-weight:750}.b{font-size:18px;fill:#334155}.n{font-size:16px;fill:#64748b}.m{font-family:"JetBrains Mono",monospace;font-size:17px;fill:#312e81}.tag{font-size:17px;font-weight:700}</style></defs><rect width="1200" height="670" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">빠른 검색과 좋은 검색은 따로 검증해야 한다</text><text x="60" y="101" class="c">실행 시간이 짧아도 틀린 후보를 반환하면 챗봇의 답변 품질은 좋아지지 않는다.</text><g filter="url(#s)"><rect x="70" y="155" width="485" height="390" rx="24" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><rect x="645" y="155" width="485" height="390" rx="24" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/></g><text x="312" y="205" text-anchor="middle" class="h">성능 검증</text><text x="887" y="205" text-anchor="middle" class="h">검색 품질 검증</text><rect x="120" y="240" width="385" height="72" rx="14" fill="#fff" stroke="#7dd3fc"/><text x="312" y="270" text-anchor="middle" class="m">EXPLAIN (ANALYZE, BUFFERS)</text><text x="312" y="298" text-anchor="middle" class="n">실제 실행 계획과 버퍼 확인</text><text x="125" y="360" class="b">• Seq Scan / Bitmap Index Scan</text><text x="125" y="402" class="b">• 후보 행 수와 제거된 행 수</text><text x="125" y="444" class="b">• 실행 시간과 읽은 버퍼</text><text x="125" y="486" class="b">• 데이터 증가 후에도 경로가 유지되는가?</text><g><rect x="690" y="238" width="130" height="42" rx="21" fill="#fff" stroke="#c084fc"/><rect x="835" y="238" width="130" height="42" rx="21" fill="#fff" stroke="#c084fc"/><rect x="980" y="238" width="105" height="42" rx="21" fill="#fff" stroke="#c084fc"/><text x="755" y="265" text-anchor="middle" class="tag">PostgreSQL</text><text x="900" y="265" text-anchor="middle" class="tag">postgreql</text><text x="1032" y="265" text-anchor="middle" class="tag">pg</text></g><text x="700" y="335" class="b">• 기대한 결과가 몇 번째인가?</text><text x="700" y="377" class="b">• 관련 없는 후보가 섞이지 않는가?</text><text x="700" y="419" class="b">• 짧은 검색어가 결과를 넓히지 않는가?</text><text x="700" y="461" class="b">• 결과 없음과 오류를 구분하는가?</text><path d="M312 555V590H540" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M887 555V590H660" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="470" y="570" width="260" height="70" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="600" y="600" text-anchor="middle" class="h">사용 가능한 Tool</text><text x="600" y="626" text-anchor="middle" class="n">빠르고, 관련된 후보를 반환</text></svg>