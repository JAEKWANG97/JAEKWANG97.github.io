<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">GIN 후보 추출과 원래 조건 재확인</title><desc id="desc">검색어의 trigram으로 GIN에서 후보 행을 찾고 테이블 행을 읽어 원래 ILIKE 조건으로 재확인한 뒤 최종 결과를 반환하는 과정</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:23px;font-weight:750}.b{font-size:18px;fill:#334155}.n{font-size:16px;fill:#64748b}.m{font-family:"JetBrains Mono",monospace;font-size:17px;fill:#312e81}.step{font-size:17px;font-weight:750;fill:#64748b}</style></defs><rect width="1200" height="690" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">GIN은 최종 답을 저장하지 않고, 확인할 후보를 먼저 줄인다</text><text x="60" y="101" class="c">인덱스로 후보 행을 찾은 뒤 원래 ILIKE 조건을 다시 검사한다.</text><path d="M280 298H345" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M600 298H665" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M920 298H985" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><g filter="url(#s)"><rect x="55" y="175" width="225" height="245" rx="22" fill="#fff3bf" stroke="#eab308" stroke-width="2"/><rect x="345" y="175" width="255" height="245" rx="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><rect x="665" y="175" width="255" height="245" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><rect x="985" y="175" width="160" height="245" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/></g><text x="80" y="210" class="step">1 · 검색어 분해</text><text x="167" y="258" text-anchor="middle" class="h">postgre</text><text x="167" y="310" text-anchor="middle" class="m">pos · ost · stg</text><text x="167" y="352" text-anchor="middle" class="n">pg_trgm</text><text x="370" y="210" class="step">2 · 후보 행 조회</text><text x="472" y="258" text-anchor="middle" class="h">GIN 역색인</text><text x="472" y="306" text-anchor="middle" class="m">pos → 3, 17, 42</text><text x="472" y="346" text-anchor="middle" class="m">ost → 3, 17</text><text x="472" y="382" text-anchor="middle" class="n">Bitmap Index Scan</text><text x="690" y="210" class="step">3 · 원래 조건 재확인</text><text x="792" y="255" text-anchor="middle" class="h">테이블 행 읽기</text><text x="792" y="304" text-anchor="middle" class="m">ILIKE '%postgre%'</text><text x="792" y="350" text-anchor="middle" class="b">3 ✓  17 ✓  42 ✕</text><text x="792" y="387" text-anchor="middle" class="n">Bitmap Heap Scan</text><text x="1010" y="210" class="step">4 · 결과</text><text x="1065" y="267" text-anchor="middle" class="h">3번</text><text x="1065" y="315" text-anchor="middle" class="h">17번</text><text x="1065" y="367" text-anchor="middle" class="n">최종 반환</text><rect x="110" y="485" width="980" height="120" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="145" y="525" class="h">왜 다시 확인할까?</text><text x="145" y="565" class="b">trigram이 겹친다는 사실은 “가능성이 있다”는 뜻이지, 원래 검색 조건을 만족한다는 최종 판정은 아니다.</text><rect x="285" y="630" width="630" height="42" rx="21" fill="#fef3c7" stroke="#f59e0b"/><text x="600" y="657" text-anchor="middle" class="b">인덱스는 검사 대상을 줄이고, 원래 조건이 정답을 결정한다.</text></svg>