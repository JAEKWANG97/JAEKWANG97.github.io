<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">검색 Tool 응답 계약</title><desc id="desc">검색 Tool이 LLM에게 단순 문자열 대신 id, 이름, 점수, 일치 유형과 빈 결과 상태를 반환한다</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter><style>text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#0f172a}.t{font-size:34px;font-weight:750}.c{font-size:20px;fill:#475569}.h{font-size:24px;font-weight:750}.b{font-size:18px;fill:#334155}.n{font-size:16px;fill:#64748b}.m{font-family:"JetBrains Mono",monospace;font-size:17px;fill:#312e81}.k{font-size:17px;font-weight:700}</style></defs><rect width="1200" height="650" rx="28" fill="#f8fafc"/><text x="60" y="65" class="t">검색 결과뿐 아니라 “왜 선택됐는지”도 Tool 계약에 담는다</text><text x="60" y="101" class="c">식별자·점수·일치 유형·빈 결과 상태가 있어야 LLM이 다음 행동을 구분할 수 있다.</text><path d="M300 300H380" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M820 300H900" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><g filter="url(#s)"><rect x="55" y="185" width="245" height="230" rx="22" fill="#fff3bf" stroke="#eab308" stroke-width="2"/><rect x="380" y="145" width="440" height="340" rx="22" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><rect x="900" y="185" width="245" height="230" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/></g><text x="177" y="230" text-anchor="middle" class="h">Tool 입력</text><text x="85" y="285" class="m">query: "postgre"</text><text x="85" y="325" class="m">limit: 5</text><text x="177" y="375" text-anchor="middle" class="n">허용된 필드만 전달</text><text x="600" y="190" text-anchor="middle" class="h">Tool 응답</text><text x="420" y="245" class="m">id: 17</text><text x="420" y="285" class="m">name: "PostgreSQL 성능 최적화"</text><text x="420" y="325" class="m">score: 0.63</text><text x="420" y="365" class="m">matchType: "contains"</text><line x1="420" y1="394" x2="780" y2="394" stroke="#a5b4fc" stroke-width="2"/><text x="420" y="430" class="n">결과 없음: results: []</text><text x="420" y="460" class="n">호출 실패: error 상태를 별도로 반환</text><text x="1022" y="230" text-anchor="middle" class="h">LLM 판단</text><text x="1022" y="285" text-anchor="middle" class="b">상세 조회</text><text x="1022" y="325" text-anchor="middle" class="b">사용자에게 답변</text><text x="1022" y="365" text-anchor="middle" class="b">검색 실패 설명</text><rect x="210" y="535" width="780" height="58" rx="29" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="572" text-anchor="middle" class="k">score는 의미적 신뢰도가 아니라 문자열 trigram 유사도다.</text></svg>