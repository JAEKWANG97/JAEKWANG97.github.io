<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI 챗봇 검색 Tool의 역할 분리</title>
  <desc id="desc">사용자 질문에서 LLM이 검색어를 정하고, 검색 Tool이 PostgreSQL을 조회한 뒤 결과를 LLM에게 돌려주는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 750; }
      .claim { font-size: 20px; fill: #475569; }
      .node-title { font-size: 24px; font-weight: 700; }
      .body { font-size: 18px; fill: #334155; }
      .small { font-size: 16px; fill: #475569; }
      .arrow-label { font-size: 16px; font-weight: 650; fill: #475569; }
      .code { font-family: "JetBrains Mono", "Noto Sans Mono", monospace; font-size: 17px; fill: #312e81; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="#f8fafc"/>
  <text x="60" y="66" class="title">LLM은 검색어를 정하고, 실제 검색은 Tool과 DB가 수행한다</text>
  <text x="60" y="101" class="claim">자연어 이해와 데이터 조회를 한 구성요소의 역할로 섞지 않는다.</text>

  <path d="M255 267 H333" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M548 267 H626" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M841 267 H919" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text x="275" y="244" class="arrow-label">질문 전달</text>
  <text x="567" y="244" class="arrow-label">Tool 호출</text>
  <text x="860" y="244" class="arrow-label">SQL 실행</text>

  <g filter="url(#shadow)">
    <rect x="55" y="177" width="200" height="180" rx="22" fill="#fff3bf" stroke="#eab308" stroke-width="2"/>
    <rect x="348" y="177" width="200" height="180" rx="22" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="641" y="177" width="200" height="180" rx="22" fill="#a5d8ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="934" y="177" width="210" height="180" rx="22" fill="#c3fae8" stroke="#10b981" stroke-width="2"/>
  </g>

  <text x="155" y="222" text-anchor="middle" class="node-title">사용자</text>
  <text x="155" y="263" text-anchor="middle" class="body">“postgre 관련</text>
  <text x="155" y="291" text-anchor="middle" class="body">문서를 찾아줘”</text>

  <text x="448" y="222" text-anchor="middle" class="node-title">LLM</text>
  <text x="448" y="263" text-anchor="middle" class="body">의도 해석</text>
  <text x="448" y="291" text-anchor="middle" class="body">검색어 결정</text>

  <text x="741" y="222" text-anchor="middle" class="node-title">검색 Tool</text>
  <text x="741" y="263" text-anchor="middle" class="body">입력·limit 검증</text>
  <text x="741" y="291" text-anchor="middle" class="body">준비된 SQL 사용</text>

  <text x="1039" y="222" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="1039" y="263" text-anchor="middle" class="body">후보 행 검색</text>
  <text x="1039" y="291" text-anchor="middle" class="body">유사도 계산</text>

  <path d="M1039 368 V418 H448 V368" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrow)"/>
  <text x="743" y="407" text-anchor="middle" class="arrow-label">검색 결과 + id + score 반환</text>

  <rect x="325" y="448" width="550" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="352" y="480" class="small">Tool 입력 예시</text>
  <text x="352" y="518" class="code">{ "query": "postgre", "limit": 5 }</text>
  <text x="600" y="584" text-anchor="middle" class="claim">핵심: LLM이 임의 SQL을 만드는 구조가 아니라, 제한된 검색 계약을 호출한다.</text>
</svg>
