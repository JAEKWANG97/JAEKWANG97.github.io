<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" viewBox="0 0 760 790" role="img" aria-labelledby="title desc"><title id="title">병렬 에이전트의 격리 경계</title><desc id="desc">작업 A와 B의 코드 작업장은 분리되어 있지만 같은 DB와 외부 API를 호출하면 공유 상태와 외부 효과가 남는다. 소유권, 멱등성, 결과 조회와 승인이 필요하다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#85522f" stroke-width="1.5"/></marker></defs><rect width="760" height="790" rx="18" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif" fill="#252724"><text x="44" y="55" font-size="19" fill="#85522f" font-weight="600">ENGINEERING NOTES / 02</text><text x="44" y="107" font-size="33" fill="#252724" font-weight="700">작업장을 나눠도 남는 공유 상태</text><rect x="44" y="155" width="316" height="168" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="70" y="200" font-size="30" fill="#252724" font-weight="650">에이전트 A</text><text x="70" y="244" font-size="26" fill="#62665e" font-weight="400">worktree A</text><text x="70" y="288" font-size="25" fill="#52664f" font-weight="400">파일 변경은 분리</text><rect x="400" y="155" width="316" height="168" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="426" y="200" font-size="30" fill="#252724" font-weight="650">에이전트 B</text><text x="426" y="244" font-size="26" fill="#62665e" font-weight="400">worktree B</text><text x="426" y="288" font-size="25" fill="#52664f" font-weight="400">파일 변경은 분리</text><path d="M202 333L202 387" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M558 333L558 387" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="401" width="672" height="166" rx="12" fill="#efe3d5" stroke="#c6a17e"/><text x="70" y="447" font-size="30" fill="#252724" font-weight="650">공유 DB · 외부 API · 실행 권한</text><text x="70" y="494" font-size="26" fill="#252724" font-weight="400">같은 상태를 바꾸면 충돌할 수 있습니다.</text><text x="70" y="537" font-size="28" fill="#85522f" font-weight="650">타임아웃 ≠ 실행되지 않음</text><text x="44" y="626" font-size="26" fill="#85522f" font-weight="650">먼저 정할 것</text><text x="44" y="669" font-size="27" fill="#252724" font-weight="400">소유권과 순서 · 멱등성 · 이전 결과 조회</text><text x="44" y="710" font-size="27" fill="#252724" font-weight="400">외부 효과의 승인 범위 · 실패 후 복구</text><text x="44" y="757" font-size="21" fill="#62665e" font-weight="400">발표를 종합한 적용 제안 · 공식 발표 도표가 아닙니다.</text></g></svg>