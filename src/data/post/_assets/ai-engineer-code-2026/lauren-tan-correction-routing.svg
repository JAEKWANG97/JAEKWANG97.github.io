<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc"><title id="title">반복되는 오류의 교정 위치 선택</title><desc id="desc">설계, 자동 검사, 실행 검증, 판단과 문서 순서로 적절한 교정 수단을 검토하는 독자적인 적용 도식.</desc><rect width="760" height="1030" rx="18" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif" fill="#252724"><text x="40" y="55" font-size="18" fill="#85522f">LAUREN TAN / APPLICATION NOTES</text><text x="40" y="108" font-size="34" font-weight="700">반복 실수, 어디에서 막을까?</text><text x="40" y="150" font-size="23" fill="#62665e">지침을 늘리기 전에 교정 위치를 고릅니다.</text><rect x="40" y="190" width="680" height="135" rx="12" fill="#e9eee6" stroke="#d5d3c8"/><text x="60" y="229" font-size="20" fill="#85522f">01</text><text x="60" y="267" font-size="27" font-weight="650">설계로 잘못된 선택을 없앨 수 있나?</text><text x="60" y="301" font-size="23" fill="#62665e">API · 상태 모델 · 단일 진입점</text><path d="M380 330v20m-6-6 6 6 6-6" stroke="#85522f" stroke-width="2" fill="none"/><rect x="40" y="360" width="680" height="135" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="60" y="399" font-size="20" fill="#85522f">02</text><text x="60" y="437" font-size="27" font-weight="650">기계가 규칙 위반을 판정할 수 있나?</text><text x="60" y="471" font-size="23" fill="#62665e">타입 · 의존성 검사 · 계약 검사</text><path d="M380 500v20m-6-6 6 6 6-6" stroke="#85522f" stroke-width="2" fill="none"/><rect x="40" y="530" width="680" height="135" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="60" y="569" font-size="20" fill="#85522f">03</text><text x="60" y="607" font-size="27" font-weight="650">실행 순서와 실제 결과가 중요한가?</text><text x="60" y="641" font-size="23" fill="#62665e">재시도 · 동시 요청 · 실패 후 상태</text><path d="M380 670v20m-6-6 6 6 6-6" stroke="#85522f" stroke-width="2" fill="none"/><rect x="40" y="700" width="680" height="135" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="60" y="739" font-size="20" fill="#85522f">04</text><text x="60" y="777" font-size="27" font-weight="650">맥락과 판단이 필요한가?</text><text x="60" y="811" font-size="23" fill="#62665e">결정 이유 · 예외 조건 · 사람의 검토</text><text x="40" y="920" font-size="25" font-weight="650">검사도 검증합니다: 오류는 막고 정상 변경은 허용</text><text x="40" y="975" font-size="20" fill="#62665e">백엔드 적용 제안 · 공식 발표 슬라이드가 아닙니다.</text></g></svg>