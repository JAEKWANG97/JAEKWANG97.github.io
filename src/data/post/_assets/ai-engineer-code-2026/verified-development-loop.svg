<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1140" viewBox="0 0 760 1140" role="img" aria-labelledby="title desc"><title id="title">검증 가능한 AI 개발 루프</title><desc id="desc">환경과 작업 기준을 정하고, 작은 구현과 독립 검증을 거쳐 배포 결과를 확인한다. 실패와 교정은 다음 작업 기준과 검사에 반영한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#85522f" stroke-width="1.5"/></marker></defs><rect width="760" height="1140" rx="18" fill="#f7f4ed"/><g font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif" fill="#252724"><text x="44" y="55" font-size="19" fill="#85522f" font-weight="600">ENGINEERING NOTES / 01</text><text x="44" y="107" font-size="35" fill="#252724" font-weight="700">검증 가능한 AI 개발 루프</text><text x="44" y="151" font-size="25" fill="#62665e" font-weight="400">코드 생성 이후에도 작업은 이어집니다.</text><rect x="44" y="190" width="618" height="125" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="67" y="234" font-size="23" fill="#85522f" font-weight="600">01</text><text x="118" y="236" font-size="30" fill="#252724" font-weight="650">환경과 작업 기준</text><text x="67" y="282" font-size="25" fill="#5d6258" font-weight="400">재현 환경 · 목표 · 범위 · 완료 조건</text><path d="M350 320L350 339" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="345" width="618" height="125" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="67" y="389" font-size="23" fill="#85522f" font-weight="600">02</text><text x="118" y="391" font-size="30" fill="#252724" font-weight="650">작은 변경 구현</text><text x="67" y="437" font-size="25" fill="#5d6258" font-weight="400">기존 구조 확인 · 변경 범위 유지</text><path d="M350 475L350 494" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="500" width="618" height="125" rx="12" fill="#e9eee6" stroke="#d5d3c8"/><text x="67" y="544" font-size="23" fill="#85522f" font-weight="600">03</text><text x="118" y="546" font-size="30" fill="#252724" font-weight="650">독립적인 검증 근거</text><text x="67" y="592" font-size="25" fill="#5d6258" font-weight="400">정적 검사 · 테스트 · 실제 실행 결과</text><path d="M350 630L350 649" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="655" width="618" height="125" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="67" y="699" font-size="23" fill="#85522f" font-weight="600">04</text><text x="118" y="701" font-size="30" fill="#252724" font-weight="650">통합과 배포 확인</text><text x="67" y="747" font-size="25" fill="#5d6258" font-weight="400">최종 버전 · 실제 응답 · 복구 가능성</text><path d="M350 785L350 804" fill="none" stroke="#85522f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="810" width="618" height="125" rx="12" fill="#fffdf8" stroke="#d5d3c8"/><text x="67" y="854" font-size="23" fill="#85522f" font-weight="600">05</text><text x="118" y="856" font-size="30" fill="#252724" font-weight="650">실패와 교정 반영</text><text x="67" y="902" font-size="25" fill="#5d6258" font-weight="400">반복 오류 → 코드 검사와 검증된 지식</text><path d="M668 870H706V252H671" fill="none" stroke="#85522f" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="44" y="1030" font-size="27" fill="#85522f" font-weight="600">권한은 검증·복구 가능한 범위에서 넓힙니다.</text><text x="44" y="1080" font-size="21" fill="#62665e" font-weight="400">발표를 종합한 적용 제안 · 공식 발표 도표가 아닙니다.</text></g></svg>